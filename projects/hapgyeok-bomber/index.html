<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>합격 폭격기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen arcade cabinet. Top bar, HUD strip, play field; captions, particles and mail alerts float above. Single deliberate night-show look. */
:root{
  --bg:#17135c; --bg2:#231c8a; --ink:#0a0830; --paper:#fff6e0; --paper2:#ece4ff;
  --yellow:#ffe14d; --pink:#ff3d8b; --mint:#38f2c0; --red:#ff4b3e; --violet:#7b6bff; --muted:#aaa4ea; --muted-ink:#6b6596;
  --display:'Black Han Sans','Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --stroke:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:18px 18px}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#bgfx{position:fixed;inset:-60%;background:conic-gradient(from 0deg,var(--yellow),var(--pink),var(--mint),var(--violet),var(--yellow));opacity:.08;animation:spin 24s linear infinite;pointer-events:none;z-index:0}
body.fever #bgfx{opacity:.42;animation-duration:2.2s}
#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;box-sizing:border-box;padding-block:10px 14px;padding-inline:16px;display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
#stagechip{font-weight:900;font-size:12px;letter-spacing:.06em;color:var(--mint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#mute{flex:none;background:transparent;color:var(--paper);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:900;cursor:pointer}
#mute[aria-pressed="true"]{color:var(--muted);border-style:dashed}
#hud{display:grid;gap:8px}
.hud-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sal span{display:block;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.06em}
.sal b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;color:var(--yellow);font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 var(--ink)}
.combo{font-family:var(--display);font-size:22px;color:var(--pink);text-shadow:var(--stroke);scale:var(--s,1);transform-origin:right bottom;white-space:nowrap}
.combo.bump{animation:bump .22s}
.hud-row2{display:flex;align-items:center;gap:8px}
.gauge{flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.12);border:2px solid var(--ink);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .35s cubic-bezier(.2,1.4,.4,1)}
body.fever .gauge i{background:linear-gradient(90deg,var(--yellow),var(--pink),var(--mint),var(--violet),var(--yellow));background-size:200% 100%;animation:slide .6s linear infinite}
.g-lbl{font-size:11px;font-weight:900;color:var(--muted);white-space:nowrap}
body.fever .g-lbl{color:var(--yellow)}
#field{position:relative;flex:1;min-height:0;border-radius:20px;background:var(--bg2);border:3px solid var(--ink);box-shadow:0 0 0 2px rgba(255,225,77,.25);overflow:hidden}
body.fever #field{animation:glow .5s ease-in-out infinite alternate}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#captions{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#flash{position:fixed;inset:0;background:var(--paper);opacity:0;pointer-events:none;z-index:80}
#flash.on{animation:flash .28s ease-out}

/* captions */
.pop{position:absolute;left:50%;top:40%;font-family:var(--display);font-size:clamp(46px,14vw,76px);white-space:nowrap;color:var(--yellow);text-shadow:var(--stroke),7px 8px 0 var(--pink);animation:popIn .95s cubic-bezier(.2,1.6,.4,1) forwards}
.pop.bad{color:var(--paper);text-shadow:var(--stroke),6px 7px 0 var(--violet);top:32%}
.pop.combo{color:var(--mint);top:56%;font-size:clamp(38px,11vw,58px)}
.pop.fever{font-size:clamp(64px,20vw,110px);animation-duration:1.3s;color:var(--paper);text-shadow:var(--stroke),6px 6px 0 var(--pink),12px 12px 0 var(--yellow)}
.pop.mega{font-size:clamp(50px,15vw,84px);animation-duration:1.5s}
.quip{position:absolute;left:50%;bottom:20%;width:min(400px,calc(100% - 48px));transform:translateX(-50%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--pink);padding:12px 14px;animation:quipIn 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
.quip small{display:block;font-size:12px;font-weight:900;color:var(--pink);letter-spacing:.04em}
.quip b{display:block;font-size:17px;line-height:1.4;font-weight:900;margin-top:2px}
.gain{position:absolute;font-family:var(--display);font-size:24px;color:var(--mint);text-shadow:var(--stroke);white-space:nowrap;animation:gainUp 1.1s ease-out forwards}
.notif{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;width:min(440px,calc(100% - 32px));transform:translateX(-50%);box-sizing:border-box;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 10px 0 rgba(10,8,48,.35);animation:dropIn .5s cubic-bezier(.2,1.5,.4,1)}
.n-top{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--muted-ink)}
.n-app{color:var(--pink)}
.notif b{display:block;font-size:15px;margin-top:3px}
.notif p{margin:2px 0 0;font-size:13px}

/* screens */
.screen,.mg,.command,.stage-title,.clear,.drum,.inbox,.ending,.title{position:absolute;inset:0}
.title{overflow-y:auto;box-sizing:border-box;padding:28px 20px 56px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.kicker{margin:0;font-weight:900;letter-spacing:.1em;font-size:13px;color:var(--mint)}
.logo{margin:0;font-family:var(--display);font-weight:400;line-height:.95;font-size:clamp(76px,25vw,124px);display:flex;flex-direction:column}
.logo span{color:var(--yellow);text-shadow:var(--stroke),8px 9px 0 var(--pink)}
.logo span+span{color:var(--paper);text-shadow:var(--stroke),8px 9px 0 var(--violet);transform:rotate(-4deg);transform-origin:left center;margin-top:4px}
.stamp{position:absolute;top:20px;right:16px;width:94px;height:94px;border-radius:50%;border:4px solid var(--pink);color:var(--pink);display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:18px;line-height:1.1;animation:stampy 2.6s ease-in-out infinite}
.tag{margin:0;font-size:15px;line-height:1.65;max-width:34ch}
.title form{display:grid;gap:8px;margin-top:4px}
.title label{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.06em}
.title input{font:inherit;font-size:18px;font-weight:700;padding:13px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);min-width:0;-webkit-user-select:text;user-select:text}
.go{font-family:var(--display);font-size:26px;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 7px 0 var(--ink);cursor:pointer;margin-top:6px}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.note{font-size:12px;color:var(--muted);margin:0}
.note b{color:var(--yellow)}
.ticker{position:absolute;left:0;right:0;bottom:0;background:var(--red);color:var(--paper);font-weight:900;font-size:13px;padding:8px 0;overflow:hidden;white-space:nowrap;border-top:3px solid var(--ink)}
.ticker-in{display:inline-block;padding-left:100%;animation:ticker 26s linear infinite}

.command{display:grid;place-content:center;text-align:center;gap:12px;z-index:4;background:repeating-linear-gradient(-45deg,var(--bg2) 0 24px,var(--bg) 24px 48px)}
.cmd{font-family:var(--display);font-size:clamp(66px,21vw,112px);color:var(--yellow);text-shadow:var(--stroke),8px 9px 0 var(--pink);animation:cmdIn .38s cubic-bezier(.2,1.8,.4,1)}
.hint{justify-self:center;font-weight:900;font-size:15px;background:var(--ink);padding:7px 14px;border-radius:10px;max-width:calc(100% - 32px)}
.stage-title{display:grid;place-content:center;text-align:center;gap:8px;background:var(--yellow);color:var(--ink);animation:wipeIn .45s cubic-bezier(.2,1.2,.4,1)}
.st-no{justify-self:center;background:var(--ink);color:var(--yellow);font-weight:900;letter-spacing:.14em;font-size:13px;padding:6px 14px;border-radius:999px}
.st-name{font-family:var(--display);font-size:clamp(40px,12vw,60px);line-height:1.1;text-wrap:balance;padding-inline:12px}
.st-sub{font-weight:700;font-size:15px}
.clear{display:grid;place-content:center;text-align:center}
.clear-t{font-family:var(--display);font-size:clamp(44px,13vw,70px);color:var(--mint);text-shadow:var(--stroke),7px 7px 0 var(--ink);animation:cmdIn .4s cubic-bezier(.2,1.8,.4,1);text-wrap:balance;padding-inline:12px}
.drum{display:grid;place-content:center;text-align:center;gap:10px}
.drum-t{font-family:var(--display);font-size:clamp(40px,12vw,60px);color:var(--paper);text-shadow:var(--stroke);animation:throb .32s ease-in-out infinite}
.drum-s{font-weight:900;color:var(--muted)}

/* microgames */
.mg{overflow:hidden;box-sizing:border-box;padding:28px 14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.mg.won{animation:wonGlow .5s}
.mg.lost{filter:grayscale(.7) brightness(.8);transition:filter .2s}
.tbar{position:absolute;left:12px;right:12px;top:10px;height:9px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;z-index:5}
.tbar i{display:block;height:100%;background:var(--yellow);transform-origin:left}
.tbar.late i{background:var(--red)}
.bigbtn{font-family:var(--display);font-size:34px;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);border-radius:999px;padding:16px 46px;box-shadow:0 8px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.bigbtn.hit{animation:press .12s}
.bigbtn.submit{background:var(--mint)}
.doc{width:100%;max-width:380px;background:var(--paper);color:var(--ink);border-radius:12px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--pink);overflow:hidden}
.doc-h{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--paper2);font-size:12px;font-weight:700}
.doc-h b{font-variant-numeric:tabular-nums}
.doc-body{height:112px;padding:10px 12px;font-size:14px;line-height:1.6;overflow:hidden}
.caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px;animation:blink .6s steps(1) infinite}
.meter{height:10px;background:var(--paper2)}
.meter i{display:block;height:100%;width:0;background:var(--pink);transition:width .08s}
.dl{width:100%;max-width:380px;box-sizing:border-box;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:14px;box-shadow:6px 6px 0 var(--pink);display:grid;gap:10px}
.dl-site{font-size:12px;font-weight:900;color:var(--muted-ink)}
.dl-clock{font-family:var(--display);font-size:clamp(32px,10vw,42px);text-align:center;font-variant-numeric:tabular-nums}
.dl.hot .dl-clock{color:var(--red);animation:throb .25s infinite}
.dl.ok .dl-clock{color:var(--ink);background:var(--mint);border-radius:8px;animation:none}
.dl-track{position:relative;height:22px;background:var(--paper2);border-radius:7px;border:2px solid var(--ink);overflow:hidden}
.dl-zone{position:absolute;top:0;bottom:0;right:0;background:var(--mint)}
.dl-needle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink)}
.dl-labels{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--muted-ink)}
.alarm{position:absolute;width:84px;height:84px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-content:center;text-align:center;color:var(--ink);cursor:pointer;padding:0;animation:ring var(--d,.1s) linear infinite alternate}
.alarm::before,.alarm::after{content:'';position:absolute;top:-12px;width:22px;height:16px;background:var(--red);border:3px solid var(--ink);border-radius:12px 12px 4px 4px}
.alarm::before{left:0;transform:rotate(-32deg)}
.alarm::after{right:0;transform:rotate(32deg)}
.face{font-family:var(--display);font-size:19px}
.zz{font-size:11px;font-weight:900;color:var(--red)}
.alarm.off{animation:none;background:var(--paper2);opacity:.6}
.alarm.off::before,.alarm.off::after{background:var(--muted)}
.alarm.off .zz{color:var(--muted-ink)}
.q{font-weight:900;font-size:15px;background:var(--ink);padding:6px 12px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;width:min(100%,340px)}
.cell{aspect-ratio:1;padding:0;font-family:var(--display);font-size:clamp(20px,7vw,34px);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;cursor:pointer}
.cell.right,.cell.reveal{background:var(--mint)}
.cell.right{animation:bump .25s}
.cell.wrong{background:var(--red);color:var(--paper)}
.code{position:absolute;inset:26px 12px 12px;margin:0;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.8;color:var(--muted);opacity:.6;white-space:pre-wrap;overflow:hidden;pointer-events:none}
.bug{position:absolute;left:0;top:0;width:52px;height:52px;padding:0;border:0;background:transparent;cursor:pointer}
.bug i{position:absolute;inset:10px 12px 6px;border:3px solid var(--ink);border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 45%,var(--ink) 3px,transparent 4px),radial-gradient(circle at 70% 68%,var(--ink) 3px,transparent 4px),var(--red)}
.bug i::before{content:'';position:absolute;left:50%;top:-11px;width:16px;height:12px;margin-left:-8px;background:var(--ink);border-radius:50% 50% 30% 30%}
.bug i::after{content:'';position:absolute;left:50%;top:1px;bottom:1px;width:3px;margin-left:-1.5px;background:var(--ink)}
.bug.dead{pointer-events:none}
.bug.dead span{font-family:var(--display);font-size:22px;color:var(--yellow);text-shadow:var(--stroke)}
.dodge{touch-action:none;cursor:grab;justify-content:flex-start}
.dodge-lbl{font-weight:900;font-size:13px;color:var(--muted)}
.me{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);box-sizing:border-box;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink);box-shadow:0 0 0 7px rgba(255,225,77,.22);z-index:3}
.me.hit{background:var(--red);color:var(--paper)}
.shot{position:absolute;left:0;top:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:900;white-space:nowrap;box-shadow:3px 3px 0 var(--pink)}
.shot.mom{box-shadow:3px 3px 0 var(--violet)}
.shot.hitshot{background:var(--red);color:var(--paper)}
.rh-top{font-weight:900;font-size:13px;color:var(--muted);position:absolute;top:30px}
.rh-bottom{font-weight:900;font-size:13px;color:var(--muted);position:absolute;bottom:18px}
.lane{position:absolute;left:0;right:0;top:50%;height:70px;margin-top:-35px;background:rgba(255,255,255,.05);border-block:2px dashed rgba(255,255,255,.18)}
.judge{position:absolute;left:34px;top:50%;width:52px;height:52px;margin-top:-26px;box-sizing:border-box;border-radius:50%;border:5px solid var(--yellow);box-shadow:0 0 18px var(--yellow);animation:pulse .45s ease-in-out infinite alternate}
.note{position:absolute;left:0;top:50%;margin-top:-22px;height:44px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.note b{width:44px;height:44px;box-sizing:border-box;border-radius:50%;background:var(--pink);border:3px solid var(--ink);flex:none}
.note span{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:5px 9px;font-size:13px;font-weight:900}
.note.hit{animation:flyUp .6s forwards}
.note.hit b{background:var(--mint)}
.note.hit span{background:var(--mint)}
.note.miss{opacity:.3;filter:grayscale(1)}
.jt{position:absolute;left:24px;top:calc(50% - 84px);font-family:var(--display);font-size:26px;color:var(--yellow);text-shadow:var(--stroke);animation:gainUp .6s ease-out forwards}
.jt.bad{color:var(--red)}

/* finale */
.inbox{background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
.ib-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:3px solid var(--ink);font-size:18px}
.badge{background:var(--red);color:var(--paper);font-weight:900;border-radius:999px;padding:3px 11px;font-variant-numeric:tabular-nums;font-size:15px}
.badge.bump{animation:bump .18s}
.ib-list{flex:1;overflow:hidden;display:flex;flex-direction:column}
.mail{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--paper2);animation:mailIn .25s cubic-bezier(.2,1.4,.4,1)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:var(--yellow);font-family:var(--display);font-size:18px}
.m-body b{font-size:14px}
.m-body p{margin:2px 0 0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-t{font-size:11px;color:var(--muted-ink);font-weight:700}
.ending{overflow-y:auto;box-sizing:border-box;padding:22px 18px 26px;display:flex;flex-direction:column;gap:16px}
.end-eyebrow{align-self:flex-start;background:var(--pink);color:var(--paper);font-weight:900;font-size:12px;letter-spacing:.05em;padding:5px 11px;border-radius:999px}
.end-title{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,42px);line-height:1.18;color:var(--yellow);text-shadow:var(--stroke),5px 6px 0 var(--pink);margin:0;text-wrap:balance}
.end-desc{margin:0;font-size:15px;line-height:1.65}
.end-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0}
.end-stats div{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 11px;min-width:0}
.end-stats div:first-child{grid-column:1/-1;background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.end-stats dt{font-size:11px;font-weight:900;color:var(--muted)}
.end-stats div:first-child dt{color:var(--ink)}
.end-stats dd{margin:2px 0 0;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.end-stats div:first-child dd{font-size:clamp(26px,8vw,34px)}
.dex h3{margin:0 0 8px;font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--muted)}
.dex ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dex li{border:2px dashed rgba(255,255,255,.25);border-radius:10px;padding:8px 6px;min-height:58px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:3px}
.dex li b{font-size:13px}
.dex li small{font-size:10.5px;line-height:1.3;color:var(--muted)}
.dex li.on{border-style:solid;border-color:var(--yellow)}
.dex li.cur{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.cheer{font-family:var(--display);font-size:21px;text-align:center;line-height:1.45;margin:4px 0;text-wrap:balance}
.end-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-family:var(--display);font-size:20px;padding:13px;border-radius:14px;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn.alt{background:var(--paper)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function mid(elm){ const b=elm.getBoundingClientRect(); return [b.left+b.width/2, b.top+b.height/2]; }
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },

/* ---------- sound ---------- */
const Snd = {
  ctx:null, master:null, muted:store.get('hgb-muted', false),
  init(){
    if(this.ctx) return;
    try{ const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=.5; this.master.connect(this.ctx.destination); }catch(e){}
  },
  tone(f, dur=.12, type='square', vol=.25, when=0, slide=0){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime+Math.max(0,when), o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide), t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.02);
  },
  noise(dur=.3, vol=.4, when=0){
    if(!this.ctx||this.muted) return;
    const c=this.ctx, t=c.currentTime+Math.max(0,when), len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=c.createBufferSource(), g=c.createGain(); s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(this.master); s.start(t);
  },
  tap(){ this.tone(660+Math.random()*260,.05,'square',.12); },
  tick(){ this.tone(1300,.03,'square',.08); },
  coin(){ this.tone(988,.07,'square',.18); this.tone(1319,.22,'square',.18,.07); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.14,'square',.18,i*.055)); this.noise(.25,.22,.28); },
  fail(){ this.tone(392,.2,'sawtooth',.18,0,.7); this.tone(294,.38,'sawtooth',.18,.2,.5); },
  boom(){ this.noise(.7,.6); this.tone(120,.6,'sine',.5,0,.3); },
  ding(i=0){ this.tone(1568+(i%6)*110,.09,'triangle',.18); }
};
const Bgm = {
  on:false, step:0, next:0, timer:0, bpm:128,
  start(){ if(!Snd.ctx||this.on) return; this.on=true; this.next=Snd.ctx.currentTime+.05; this.timer=setInterval(()=>this.sched(),25); },
  stop(){ this.on=false; clearInterval(this.timer); },
  sched(){
    const c=Snd.ctx, spb=60/(Game.fever>0?176:this.bpm)/2;
    while(this.next < c.currentTime+.12){
      const s=this.step%16, w=this.next-c.currentTime, bass=[110,110,165,110,147,110,196,165][s%8];
      if(s%4===0) Snd.tone(110,.12,'sine',.35,w,.4);
      Snd.tone(bass,.1,'triangle',.11,w);
      if(s%4===2) Snd.noise(.05,.06,w);
      if(Game.fever>0 && s%2===1) Snd.tone(bass*4,.06,'square',.05,w);
      this.step++; this.next+=spb;
    }
  }
};

/* ---------- juice ---------- */
const fx=$('#fx'), g2=fx.getContext('2d');
let parts=[], shakeAmt=0;
function resize(){ const dpr=Math.min(2,devicePixelRatio||1); fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; g2.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', resize); resize();
const PCOL=['#ffe14d','#ff3d8b','#38f2c0','#fff6e0','#7b6bff'];
function burst(x,y,n=40,power=9){
  if(reduce) n=Math.min(n,8);
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=power*(.3+Math.random());
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,gr:.25,life:1,dec:.012+Math.random()*.02,s:4+Math.random()*7,c:PCOL[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4,rect:Math.random()<.5}); }
}
function rain(n=80){
  if(reduce) n=Math.min(n,15);
  for(let i=0;i<n;i++) parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,gr:.05,life:1,dec:.003+Math.random()*.003,s:6+Math.random()*7,c:PCOL[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.3,rect:true});
}
function shake(a=10){ shakeAmt=Math.max(shakeAmt, reduce?Math.min(a,2):a); }
function flash(){ const f=$('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function pop(text, cls='', ms=1000){ const e=el('div','pop '+cls); e.textContent=text; $('#captions').append(e); setTimeout(()=>e.remove(), ms+500); }
function quip(label, text){ const e=el('div','quip',`<small>${esc(label)}</small><b>${esc(text)}</b>`); $('#captions').append(e); setTimeout(()=>e.remove(),1600); }
function floatGain(t){ const s=$('#sal').getBoundingClientRect(); const e=el('div','gain'); e.textContent=t; e.style.left=s.left+'px'; e.style.top=(s.bottom+2)+'px'; $('#captions').append(e); setTimeout(()=>e.remove(),1200); }
const salEl=$('#sal');
function loop(){
  g2.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  for(const p of parts){ p.vy+=p.gr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=p.dec;
    g2.save(); g2.globalAlpha=Math.max(0,p.life); g2.translate(p.x,p.y); g2.rotate(p.r); g2.fillStyle=p.c;
    if(p.rect) g2.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else { g2.beginPath(); g2.arc(0,0,p.s/2,0,7); g2.fill(); }
    g2.restore(); }
  if(shakeAmt>.4){ app.style.transform=`translate(${(Math.random()-.5)*shakeAmt}px,${(Math.random()-.5)*shakeAmt}px) rotate(${(Math.random()-.5)*shakeAmt*.08}deg)`; shakeAmt*=.87; }
  else if(app.style.transform){ app.style.transform=''; shakeAmt=0; }
  if(Game.shown!==Game.salary){ const d=Game.salary-Game.shown; Game.shown = Math.abs(d)<1 ? Game.salary : Game.shown+d*.12; salEl.textContent=won(Game.shown); }
  requestAnimationFrame(loop);
}

/* ---------- microgames ---------- */
function dodge(c, o){
  const r=c.root; r.classList.add('dodge');
  const W=r.clientWidth, H=r.clientHeight, R=20, shots=[];
  r.append(el('div','dodge-lbl',o.label));
  const me=el('div','me','나'); r.append(me);
  let px=W/2, py=H*.62, last=0, nextSpawn=150;
  const put=()=>{ me.style.transform=`translate(${px-24}px,${py-24}px)`; }; put();
  const mv=e=>{ if(c.over) return; const b=r.getBoundingClientRect(), off=e.pointerType==='touch'?60:0;
    px=clamp(e.clientX-b.left,24,W-24); py=clamp(e.clientY-b.top-off,44,H-24); put(); };
  r.addEventListener('pointerdown',e=>{ try{ r.setPointerCapture(e.pointerId); }catch(_){} mv(e); });
  r.addEventListener('pointermove',mv);
  function spawn(){
    const s=el('div','shot '+(o.cls||'')); s.textContent=pick(o.lines); r.append(s);
    const w=s.offsetWidth, h=s.offsetHeight, sp=(o.base+c.diff*45)*c.speed;
    let x,y,vx,vy;
    if(o.from==='side'){ const L=Math.random()<.5; y=rand(50,H-h-10); x=L?-w:W; vx=(L?1:-1)*sp; vy=0; }
    else { x=rand(0,Math.max(0,W-w)); y=-h; vx=rand(-30,30); vy=sp; }
    shots.push({s,x,y,vx,vy,w,h});
  }
  return { frame(p, now){
    const dt=last?Math.min(.05,(now-last)/1000):0; last=now;
    nextSpawn-=dt*1000;
    if(nextSpawn<=0 && p<.86){ spawn(); nextSpawn=(o.every-c.diff*40)/c.speed; }
    for(let i=shots.length-1;i>=0;i--){
      const q=shots[i]; q.x+=q.vx*dt; q.y+=q.vy*dt; q.s.style.transform=`translate(${q.x}px,${q.y}px)`;
      const cx=clamp(px,q.x,q.x+q.w), cy=clamp(py,q.y,q.y+q.h);
      if((px-cx)**2+(py-cy)**2 < R*R){ me.classList.add('hit'); me.textContent='악'; q.s.classList.add('hitshot'); c.lose(); return; }
      if(q.x<-q.w-30||q.x>W+30||q.y>H+30){ q.s.remove(); shots.splice(i,1); }
    }
  }};
}

const MG = {

    const btn=el('button','bigbtn submit','제출하기'); btn.type='button';
    c.root.append(box,btn);
    const clock=box.querySelector('.dl-clock'), needle=box.querySelector('.dl-needle');
    box.querySelector('.dl-zone').style.left=((zone-50)*10)+'%';
    let sec=50, lastS=50;
    const fmt=s=>{ const w=Math.floor(s), cs=Math.floor((s-w)*100); return `23:59:${String(w).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; };
    btn.addEventListener('pointerdown',e=>{
      e.preventDefault(); if(c.over) return;
      if(sec>=zone && sec<60){ box.classList.add('ok'); clock.textContent=fmt(sec)+' 제출!'; c.win(); }
      else { c.meta.early=true; clock.textContent='너무 일찍 냄'; c.lose(); }
    });
    return { frame(p){
      sec=50+p*10.6;
      if(sec>=60){ clock.textContent='마감되었습니다'; c.lose(); return; }
      clock.textContent=fmt(sec); needle.style.left=((sec-50)*10)+'%';
      if(Math.floor(sec)!==lastS){ lastS=Math.floor(sec); Snd.tick(); }
      if(sec>=zone) box.classList.add('hot');
    }};
  }},
  alarm:{cmd:'꺼라!', hint:'울리는 알람을 전부 탭', dur:4, timeout:'lose', start(c){
    const r=c.root, W=r.clientWidth, H=r.clientHeight, n=2+c.diff;
    const cw=W/3, ch=(H-50)/3, cells=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,n);
    let left=n;

  rhythm:{cmd:'받아쳐라!', hint:'질문이 노란 원에 닿는 순간 탭!', dur:5.4, timeout:'lose', start(c){
    const r=c.root, W=r.clientWidth, JX=60;
    const QA=shuffle([['자기소개 해보세요','열정입니다!!'],['우리 회사 왜 왔어요?','귀사가 1순위!'],['본인 단점은?','완벽한 게 단점'],['5년 뒤 모습은?','여기서 임원!'],['연봉은 얼마 원해요?','주시는 대로!'],['마지막 할 말?','뽑아주세요!!']]);
    r.append(el('div','lane'), el('div','judge'), el('div','rh-top','면접관 3명이 질문을 던집니다'), el('div','rh-bottom','원에 닿을 때 아무 데나 탭'));
    const N=c.diff>=3?5:4, D=c.dur/1000, L=1.15/c.speed, first=Math.max(L*.9,D*.22), lastT=D*.88;
    const win=.16-c.diff*.012; let misses=0, done=0;
    const notes=QA.slice(0,N).map(([q,a],i)=>{ const n=el('div','note',`<b></b><span>${esc(q)}</span>`); n.style.left=(W+40)+'px'; r.append(n); return {n,a,T:first+i*(lastT-first)/(N-1),done:false}; });
    const jt=(t,cls)=>{ const j=el('div','jt '+cls); j.textContent=t; r.append(j); setTimeout(()=>j.remove(),650); };
    const check=()=>{ if(!c.over && done===N) (misses<2?c.win():c.lose()); };
    function miss(nt){ misses++; Snd.tone(150,.15,'sawtooth',.15); shake(4); jt('MISS','bad'); if(nt){ nt.done=true; nt.n.classList.add('miss'); done++; } if(misses>=2) c.lose(); }
    r.addEventListener('pointerdown',e=>{
      if(c.over) return;
      const t=c.elapsed()/1000; let best=null, bd=9;
      for(const nt of notes) if(!nt.done){ const d=Math.abs(t-nt.T); if(d<bd){ bd=d; best=nt; } }
      if(best && bd<=win){
        best.done=true; done++; best.n.classList.add('hit'); best.n.querySelector('span').textContent=best.a;
        jt(bd<=win/2?'PERFECT':'GOOD','good'); Snd.coin(); burst(...mid(r.querySelector('.judge')),18,7); check();
      } else if(best && bd<.5) miss(null);
    });
    return { frame(p){
      const t=p*D;
      for(const nt of notes){
        if(nt.n.classList.contains('hit')) continue;
        nt.n.style.left=(JX+(nt.T-t)/L*(W-JX)-22)+'px';
        if(!nt.done && t>nt.T+win){ miss(nt); if(c.over) return; check(); }
      }
    }};
  }}
};

function hud(){
  const g=Game, cb=$('#combo');
  if(g.combo>=2){ cb.textContent=g.combo+' COMBO'; cb.style.setProperty('--s',1+Math.min(g.combo,12)*.06); cb.hidden=false; cb.classList.remove('bump'); void cb.offsetWidth; cb.classList.add('bump'); }
  else cb.hidden=true;
  $('#gauge').style.width=(g.fever>0?g.fever/3*100:g.gauge)+'%';
  $('#glbl').textContent=g.fever>0?`FEVER ×3 · ${g.fever}판`:'도파민';
}
function startFever(){
  const g=Game; g.fever=3; g.feverCount++; document.body.classList.add('fever');
  pop('FEVER!!','fever',1300); rain(140); Snd.boom(); flash(); shake(22); buzz([60,40,60,40,120]); hud();
}
function endFever(){ Game.gauge=0; document.body.classList.remove('fever'); hud(); }
function tickFever(){ if(Game.fever>0){ Game.fever--; if(!Game.fever) endFever(); } }

function success(){
  const g=Game; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
  const inFever=g.fever>0;
  const gain=STAGES[g.stage].base*rand(.8,1.4)*(1+(g.combo-1)*.25)*(inFever?3:1);
  g.salary+=gain;
  pop(pick(PRAISE),'good'); floatGain('+'+won(gain)+(inFever?' ×3':''));
  burst(innerWidth/2,innerHeight*.42,60,11); shake(16); flash(); Snd.win(); buzz([30,30,60]);
  if(g.combo%5===0) setTimeout(()=>{ pop(g.combo+' COMBO!!','combo'); rain(70); Snd.coin(); },420);
  if(inFever) tickFever();
  else { g.gauge=Math.min(100,g.gauge+34); if(g.gauge>=100) setTimeout(startFever,520); }
  hud();
}
function failure(id, meta){
  const g=Game; g.combo=0; tickFever();
  const q=pick(meta.early?QUIPS.deadlineEarly:QUIPS[id]);
  pop(pick(['앗…!','어라?','삐끗!']),'bad'); quip('근데 괜찮아', q);
  Snd.fail(); shake(7); buzz(120); hud();
}

async function command(mg, speed){
  const box=el('div','command',`<div class="cmd">${mg.cmd}</div><div class="hint">${mg.hint}</div>`);
  field.append(box); Snd.tone(523,.08,'square',.15); Snd.tone(784,.14,'square',.15,.08);
  await sleep(Math.max(750,1150/speed)); box.remove();
}
async function playOne(id){
  const mg=MG[id], speed=SPEED[Game.stage];
  await command(mg, speed);
  return new Promise(resolve=>{
    const dur=mg.dur*1000/speed, root=el('div','mg mg-'+id), bar=el('div','tbar','<i></i>'), bi=bar.firstChild;
    field.append(root);
    let raf=0, t0=performance.now(), api={};
    const c={root, diff:Game.stage+1, speed, dur, meta:{}, over:false, elapsed:()=>performance.now()-t0, win:()=>finish(true), lose:()=>finish(false)};
    function finish(ok){
      if(c.over) return; c.over=true; cancelAnimationFrame(raf);
      try{ api.cleanup && api.cleanup(); }catch(e){}
      root.classList.add(ok?'won':'lost');
      Game.results.push({id, won:ok, meta:c.meta});
      ok ? success() : failure(id, c.meta);
      setTimeout(()=>{ root.remove(); resolve(ok); }, ok?900:1600);
    }
    api=mg.start(c)||{};
    root.prepend(bar);
    const tick=now=>{
      if(c.over) return;
      const p=Math.min(1,(now-t0)/dur);
      bi.style.transform=`scaleX(${1-p})`; if(p>.72) bar.classList.add('late');
      api.frame && api.frame(p, now);
      if(c.over) return;
      if(p>=1){ finish(mg.timeout==='win'); return; }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
  });
}

async function run(){

    <p class="tag">서류 광탈러가 3분 만에 대기업 수십 곳에 붙는 게임. 틀려도 괜찮아, 어차피 합격이야.</p>

      <label for="name">합격 메일에 찍힐 이름</label>
      <input id="name" maxlength="8" placeholder="이름이나 닉네임" autocomplete="off" value="${esc(Game.name==='취준생'?'':Game.name)}">
      <button type="submit" class="go">취업 시즌 시작</button>
    </form>
    <p class="note">소리 켜고 하면 도파민 2배 · 모은 엔딩 <b>${Array.isArray(got)?got.length:0}</b>/${ENDINGS.length}</p>
  </div>
  <div class="ticker"><div class="ticker-in">속보 · 취준생 ○○○, 대기업 47곳 동시 합격 &nbsp;·&nbsp; 삼숑전자 "제발 와 달라" 공식 입장 &nbsp;·&nbsp; 면접관 3명 감동해 동시 퇴사 &nbsp;·&nbsp; 엄마, 잔소리 대신 용돈 지급 선언 &nbsp;·&nbsp; 자소서 1000자가 베스트셀러 1위</div></div>`;
  $('#startForm').addEventListener('submit',e=>{
    e.preventDefault();
    Game.name=($('#name').value.trim()||'취준생').slice(0,8);
    Snd.init(); try{ Snd.ctx && Snd.ctx.resume(); }catch(err){}
    Snd.coin(); newRun();
  });
}
const muteBtn=$('#mute');
function syncMute(){ muteBtn.textContent=Snd.muted?'소리 끔':'소리 켬'; muteBtn.setAttribute('aria-pressed',String(Snd.muted)); }
muteBtn.addEventListener('click',()=>{ Snd.muted=!Snd.muted; store.set('hgb-muted',Snd.muted); syncMute(); Snd.init(); try{ Snd.ctx && Snd.ctx.resume(); }catch(e){} });
syncMute();
requestAnimationFrame(loop);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
