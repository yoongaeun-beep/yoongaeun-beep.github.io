<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>시장조사 컨설턴트 사이트 (데모)</title><style>:root {
  --bg: #f7f8fa; --card: #ffffff; --fg: #15181e; --muted: #5f6672;
  --line: #d9dde3; --accent: #3d6fc4; --gutter: clamp(14px, 2.4vw, 40px); --accent-fg: #ffffff; --ink: #15181e;
  --warn-bg: #fff4d6; --warn-fg: #6b4b00; --bad: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --card: #1c1f25; --fg: #eceef2; --muted: #9aa1ad;
    --line: #333843; --accent: #86a9e6; --accent-fg: #10131a; --ink: #eceef2;
    --warn-bg: #4a3a10; --warn-fg: #ffe3a3; --bad: #ff8a80;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 system-ui, "Malgun Gothic", sans-serif; }
.app { max-width: 1760px; margin: 0 auto; padding: 0 var(--gutter) 40px; }
h1 { font-size: 22px; line-height: 1.35; margin: 16px 0 6px; }
h2 { font-size: 15px; margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 13px; }

/* 위 메뉴 */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0; margin: 0 calc(var(--gutter) * -1) 8px; padding: 0 var(--gutter); background: var(--card); border-bottom: 1px solid var(--line); }
.brand { font-size: 15px; font-weight: 700; padding: 14px 0; }
.nav { display: flex; align-items: stretch; gap: 20px; }
.nav-link { color: var(--muted); text-decoration: none; font-weight: 600; padding: 14px 0 12px; border-bottom: 2px solid transparent; }
.nav-link:hover { color: var(--fg); }
.nav-link.active { color: var(--fg); border-bottom-color: var(--accent); }
.nav button { border: 0; background: none; padding: 14px 0 12px; color: var(--muted); font-weight: 600; }
.link { color: var(--accent); text-decoration: none; font-weight: 600; }
.link:hover { text-decoration: underline; }

/* 각진 상자 */
.card { background: var(--card); border: 1px solid var(--line); padding: 16px; margin: 12px 0; }
.card.main { border-left: 3px solid var(--accent); }
.big { font-size: 16px; font-weight: 700; margin: 2px 0 6px; }
.notice { background: var(--warn-bg); color: var(--warn-fg); padding: 10px 14px; margin: 10px 0; }
.error { color: var(--bad); margin: 8px 0 0; min-height: 1.5em; }
.okmsg { margin: 8px 0 0; }
.messages { min-height: 1.5em; }

/* 홈 첫 화면 */
.hero { display: grid; grid-template-columns: 1fr; gap: 16px; margin: 16px 0; }
.hero.with-promo { grid-template-columns: 3fr 2fr; }
.hero-title { font-size: 20px; margin: 0 0 4px; }
.intake { border: 1px solid var(--ink); background: var(--card); }
.intake textarea { border: 0; min-height: 110px; resize: vertical; }
.intake-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--line); }
.intake-foot .hint { flex: 1; }
.promo { border: 1px solid var(--line); background: var(--card); padding: 16px; }
.promo ul { margin: 6px 0 0; padding-left: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0; }
.stat { background: var(--card); border: 1px solid var(--line); padding: 12px 16px; }
.stat-num { font-size: 22px; font-weight: 700; display: block; }

/* 입력칸·단추 */
.form { display: grid; gap: 12px; max-width: 420px; }
.form.wide { max-width: 720px; }
.form label, .field { display: grid; gap: 4px; font-weight: 600; }
.field-label { font-weight: 700; }
.hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.readonly { font-weight: 400; padding: 8px 12px; background: var(--bg); border: 1px solid var(--line); }
input, textarea, select { font: inherit; padding: 8px 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 0; width: 100%; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, a.button { font: inherit; font-weight: 600; padding: 8px 16px; border: 1px solid var(--ink); background: var(--card); color: var(--fg); cursor: pointer; border-radius: 0; text-decoration: none; display: inline-block; }
button.primary, a.button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
a.button { margin-top: 6px; }
button:disabled { opacity: .6; cursor: default; }
.form label.check, .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 0; }
.check input { width: auto; margin: 0; flex-shrink: 0; }
.login-wrap { max-width: 400px; margin: 10vh auto 0; }

/* 표 같은 목록 */
.list { list-style: none; padding: 0; margin: 6px 0 0; }
.list-item { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.item-title { color: var(--fg); font-weight: 700; text-decoration: none; }
.item-title:hover { text-decoration: underline; color: var(--accent); }

@media (max-width: 720px) {
  .app { padding: 0 14px 28px; }
  .topbar { margin: 0 -14px 8px; padding: 0 14px; flex-wrap: wrap; }
  .hero.with-promo { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr; }
  .nav { gap: 14px; }
}

/* 뒤로가기 줄과 저장 알림 */
.backbar { display: flex; align-items: center; gap: 16px; margin: 8px 0 0; }
button.back { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; }
button.back:hover { text-decoration: underline; }
.toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; background: var(--ink); color: var(--bg); padding: 10px 20px; font-weight: 600; }
.toast.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-fg); }

/* 조사 상세: 저장한 결과 보기 */
.doc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.doc-head select { width: auto; }
.paste-area { min-height: 320px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.doc { overflow-x: auto; line-height: 1.7; }
.doc h1, .doc h2, .doc h3 { margin: 16px 0 6px; }
.doc table { border-collapse: collapse; margin: 8px 0; }
.doc th, .doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.doc th { background: var(--bg); }
.doc a { color: var(--accent); }
.doc code { background: var(--bg); padding: 1px 4px; }
.doc pre { background: var(--bg); padding: 10px; overflow-x: auto; }



/* 넓은 모니터에서 오른쪽이 비지 않게: 카드는 나란히, 입력칸은 여러 열로 */
.app { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 0 var(--gutter); align-content: start; grid-auto-flow: row dense; }
.app > * { grid-column: 1 / -1; min-width: 0; }
.app > .card { grid-column: auto; }
.app > .card:has(.form.wide), .app > .card:has(.brief), .app > .card:has(.doc table) { grid-column: 1 / -1; }
.app > a.button { justify-self: start; }
.form.wide { max-width: none; grid-template-columns: repeat(auto-fit, minmax(max(300px, calc((100% - 48px) / 3)), 1fr)); gap: 12px 24px; align-items: start; }
.form.wide > * { grid-column: 1 / -1; }
.form.wide > .profile-field, .form.wide > .field { grid-column: auto; }
.form.wide > button { justify-self: start; }
.profile-field:last-of-type { border-bottom: 1px solid var(--line); }
@media (max-width: 720px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* 기업 카드: 칸마다 [이름 | 고르는 곳] 줄로, 위아래로 줄을 맞춘다 */
.form.wide.profile-form { grid-template-columns: minmax(0, 1fr); max-width: 1240px; gap: 0; }
.profile-field { display: grid; grid-template-columns: minmax(170px, 230px) minmax(0, 1fr); gap: 8px 28px; padding: 18px 0; border-top: 1px solid var(--line); }
.profile-field:last-of-type { border-bottom: 0; }
.pf-title { margin: 0; font-size: 15px; }
.pf-head .hint { margin: 4px 0 0; }
.pf-body { display: grid; gap: 10px; }
.pf-group { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 14px; align-items: start; }
.pf-group-label { font-size: 13px; font-weight: 700; color: var(--muted); padding-top: 9px; }
.pf-group select { max-width: 320px; }
.pf-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.pf-options .check { border: 1px solid var(--line); background: var(--card); padding: 8px 12px; cursor: pointer; min-height: 38px; }
.pf-options .check:hover { border-color: var(--accent); }
.pf-options .check:has(input:checked) { border-color: var(--accent); background: var(--sky, rgba(61, 111, 196, .12)); font-weight: 600; }
.form-actions { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 0; display: flex; align-items: center; gap: 16px; z-index: 2; }
.form-actions .messages { min-height: 0; }
.form-actions .messages p { margin: 0; }
@media (max-width: 720px) {
  .profile-field { grid-template-columns: minmax(0, 1fr); }
  .pf-group { grid-template-columns: minmax(0, 1fr); }
  .pf-group-label { padding-top: 0; }
}

/* 트렌드 브리프 보기 전용 스타일(styles.css 다음에 읽는다) */
/* 트렌드 브리프 도식 보기: 하늘색 바탕 + 선명한 파랑 하나, 노랑은 주의에만 */
.brief { --bb: #3d6fc4; --bn: #1d3560; --bs: #edf2fa; --bl: #d9e2f1; --by: #f7ecc6; --byt: #6f5416; --bg2: #ffffff; --bt: #1b2333; --bm: #5b6678; display: grid; gap: 14px; color: var(--bt); }
@media (prefers-color-scheme: dark) {
  .brief { --bs: #1e2b44; --bl: #32456a; --by: #4a3a10; --byt: #ffe3a3; --bg2: #1c2330; --bt: #eaf0fb; --bm: #a6b2c6; --bn: #d3e0f7; }
}
.brief .mut { color: var(--bm); font-size: 13px; }
.bhero { display: flex; gap: 14px; flex-wrap: wrap; }
.bhero-main { flex: 3 1 520px; background: linear-gradient(120deg, #3d6fc4 55%, #4f7fcb); color: #fff; padding: 20px 24px; display: grid; gap: 14px; align-content: start; }
.bhero-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.bhero-main .doc { font-size: 19px; font-weight: 700; line-height: 1.5; }
.bhero-main .doc p { margin: 0; }
sup.fn { color: var(--accent); font-weight: 700; font-size: 11px; margin-left: 1px; }
.bhero-main sup.fn { color: #f7ecc6; }
.meter-title { font-size: 12px; margin-bottom: 6px; }
.meter-bar { display: flex; gap: 3px; height: 14px; }
.meter-cell { flex: 1; background: rgba(255, 255, 255, .35); }
.meter-cell.meter-on { background: #f7ecc6; }
.meter-names { display: flex; font-size: 12px; margin-top: 4px; }
.meter-name { flex: 1; }
.meter-name:last-child { text-align: right; }
.meter-name.meter-on { font-weight: 700; color: #f7ecc6; text-align: center; }
.bhero-tiles { flex: 2 1 340px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.bhero-tile { padding: 14px 18px; color: #fff; display: grid; align-content: center; }
.bhero-tile b { font-size: 30px; line-height: 1.1; }
.bhero-tile-1 { background: #3d6fc4; } .bhero-tile-2 { background: #1d3560; } .bhero-tile-3 { background: #4676c4; } .bhero-tile-4 { background: #6a80a8; }
.brief-layout { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }

.bcards { flex: 999 1 520px; min-width: 0; display: grid; gap: 14px; }
button.link-button { justify-self: end; border: 0; background: none; padding: 0; color: var(--bb); font-weight: 600; }
.ev-box { background: var(--bg2); border: 1px solid var(--bl); padding: 12px 16px; display: grid; gap: 8px; }
.ev-bar { display: flex; gap: 3px; flex-wrap: wrap; }
.ev-cell { width: 22px; height: 22px; }
.ev-verified { background: #3d6fc4; } .ev-read { background: #7ea1dc; } .ev-summary { background: #a9b9d6; }
.bcard { background: var(--bg2); border: 1px solid var(--bl); }
.bcard-trend { border-top: 4px solid var(--bb); }
.bcard-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 16px; background: linear-gradient(90deg, var(--bs), transparent 70%); border-bottom: 1px solid var(--bl); }
button.bcard-title { flex: 1; text-align: left; border: 0; background: none; padding: 10px 0; font-weight: 700; font-size: 16px; color: var(--bn); }
.bcard-badges { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
.fit, .count, .badge { padding: 1px 10px; font-size: 12px; font-weight: 700; }
.fit-yes, .badge-verified { background: var(--bb); color: #fff; }
.fit-cond, .fit-weak, .badge-summary { background: var(--by); color: var(--byt); }
.count, .badge-read { background: var(--bs); color: var(--bn); font-weight: 400; }
.bcard-body { padding: 14px 16px; display: grid; gap: 14px; }
.bcard-body .doc p { margin: 0 0 8px; }
.fn-box { margin-top: 4px; border-top: 1px solid var(--bl); padding-top: 10px; }
.fn-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; color: var(--bn); }
.fn-table { display: grid; grid-template-columns: 48px minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1.6fr); font-size: 13px; overflow-x: auto; }
.fn-head { background: var(--bs); padding: 5px 8px; font-weight: 700; }
.fn-cell { padding: 8px; border-top: 1px solid var(--bl); display: grid; gap: 3px; align-content: start; }
.fn-num { color: var(--bb); font-weight: 700; }
.excerpt { font-style: italic; }
.badge { justify-self: start; }

/* 도식 공통 */
.dg { margin: 0; display: grid; gap: 8px; }
.dg-title { font-size: 13px; font-weight: 700; color: var(--bn); }
.dg-scroll { overflow-x: auto; }
.tone-warn { --tone: #c29a2a; }
.tone-ok { --tone: #3d6fc4; }
.tone-gray { --tone: #8aa0c8; }
.dg-timeline { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); border-top: 6px solid var(--bl); padding-top: 4px; overflow-x: auto; }
.tl-item { --tone: #3d6fc4; display: grid; gap: 4px; align-content: start; padding: 0 12px 0 0; }
.tl-dot { width: 16px; height: 16px; background: var(--tone); border: 3px solid var(--bg2); order: -1; margin: -13px 0 4px; }
.tl-label { font-weight: 700; }
.tl-title { font-size: 13px; font-weight: 700; }
.dg-steps { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.st-item { flex: 1 1 140px; border: 1px solid var(--bl); background: var(--bg2); padding: 10px 12px; display: grid; gap: 4px; align-content: start; }
.st-hot { background: var(--bb); border-color: var(--bb); color: #fff; }
.st-hot .mut { color: #e6eefb; }
.st-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: var(--bb); color: #fff; font-weight: 700; font-size: 12px; }
.st-hot .st-num { background: #fff; color: var(--bb); }
.st-title { font-weight: 700; }
.st-arrow { align-self: center; color: var(--bb); font-weight: 700; }
.dg-compare { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.cp-left, .cp-right { flex: 1 1 260px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.cp-left { border: 1px solid var(--bl); background: var(--bg2); }
.cp-right { border: 2px solid var(--bb); background: var(--bs); }
.cp-title { font-weight: 700; }
.cp-arrow { align-self: center; text-align: center; color: var(--byt); font-weight: 700; display: grid; gap: 2px; }
.dg-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chipcard { --tone: #8aa0c8; flex: 1 1 150px; border: 1px solid var(--bl); border-top: 3px solid var(--tone); padding: 10px 12px; background: var(--bg2); display: grid; gap: 4px; align-content: start; }
.chipcard.tone-ok { background: var(--bs); border: 2px solid var(--bb); }
.chipcard.tone-warn { background: var(--by); }
.dg-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile-card { background: var(--bs); padding: 10px 12px; display: grid; gap: 4px; align-content: start; }
.tile-title { color: var(--bb); font-weight: 700; }
.dg-stairs { display: flex; gap: 6px; align-items: flex-end; }
.stair { flex: 1; background: #a9b9d6; color: #1d3560; padding: 6px 10px; display: grid; align-content: start; gap: 2px; font-weight: 700; }
.stair:nth-child(2) { background: #4676c4; color: #fff; } .stair:nth-child(n+3) { background: #3d6fc4; color: #fff; }
.stair-note { font-weight: 400; font-size: 12px; }
.stair-h1 { min-height: 56px; } .stair-h2 { min-height: 86px; } .stair-h3 { min-height: 116px; } .stair-h4 { min-height: 146px; } .stair-h5 { min-height: 176px; }
.dg-matrix { border-collapse: collapse; font-size: 13px; width: 100%; }
.dg-matrix th, .dg-matrix td { border-top: 1px solid var(--bl); padding: 6px 8px; text-align: center; }
.dg-matrix thead th { color: var(--bn); border-top: 0; }
.dg-matrix th.mk-label { text-align: left; font-weight: 400; }
.mk-yes { color: var(--bb); font-weight: 700; } .mk-check { color: #a9801a; font-weight: 700; } .mk-none { color: #a9b9d6; }
.dg-flow { display: grid; gap: 8px; }
.fl-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.fl-q { flex: 2 1 260px; background: var(--bn); color: #fff; padding: 10px 14px; }
.fl-yes, .fl-no { flex: 1 1 170px; padding: 10px 14px; display: grid; gap: 4px; align-content: start; }
.fl-yes { background: var(--bs); } .fl-no { background: var(--by); color: var(--byt); }
.fl-tag { justify-self: start; font-size: 12px; font-weight: 700; padding: 1px 10px; background: var(--bb); color: #fff; }
.fl-no .fl-tag { background: var(--byt); color: var(--by); }
.dg-map { position: relative; height: 300px; border-left: 2px solid var(--bt); border-bottom: 2px solid var(--bt); background: linear-gradient(135deg, var(--bs), transparent); }
.dg-map::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--bl); }
.dg-map::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed var(--bl); }
.map-axis-y { position: absolute; left: 8px; top: 6px; font-size: 12px; color: var(--bm); }
.map-axis-x { position: absolute; right: 8px; bottom: 6px; font-size: 12px; color: var(--bm); }
.map-dot { position: absolute; transform: translate(-50%, 50%); background: var(--bb); color: #fff; padding: 5px 12px; font-weight: 700; font-size: 13px; z-index: 1; white-space: nowrap; }
.map-dot.tone-warn { background: #a9801a; } .map-dot.tone-gray { background: #6a80a8; }
.px-0 { left: 6%; } .px-1 { left: 10%; } .px-2 { left: 20%; } .px-3 { left: 30%; } .px-4 { left: 40%; } .px-5 { left: 50%; } .px-6 { left: 60%; } .px-7 { left: 70%; } .px-8 { left: 80%; } .px-9 { left: 88%; } .px-10 { left: 92%; }
.py-0 { bottom: 8%; } .py-1 { bottom: 14%; } .py-2 { bottom: 24%; } .py-3 { bottom: 34%; } .py-4 { bottom: 44%; } .py-5 { bottom: 54%; } .py-6 { bottom: 64%; } .py-7 { bottom: 74%; } .py-8 { bottom: 84%; } .py-9 { bottom: 90%; } .py-10 { bottom: 94%; }
.dg-hub { display: grid; gap: 8px; justify-items: center; }
.hub-row { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
.hub-node { flex: 1 1 180px; border: 1px solid var(--bb); background: var(--bs); padding: 10px; text-align: center; display: grid; gap: 2px; }
.hub-center { background: var(--bb); color: #fff; padding: 12px 28px; text-align: center; display: grid; gap: 2px; }
.hub-center-note { font-size: 12px; }
@media (max-width: 720px) {
  .brief-nav { position: static; flex-basis: 100%; }
  .fn-table { grid-template-columns: minmax(0, 1fr); }
  .fn-head { display: none; }
  .fn-num { border-top: 2px solid var(--bb); }
  .dg-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dg-map { height: 340px; }
}

/* 소제목은 얇은 가로선으로 나눈다 */
.sub { border: 0; background: none; border-top: 1px solid var(--bl); padding-top: 12px; }
.bcard-body > :first-child { border-top: 0; padding-top: 0; }
.sub-h { padding: 0; background: none; border: 0; font-weight: 700; font-size: 14px; color: var(--bn); margin-bottom: 8px; }
.sub-b { padding: 0; display: grid; gap: 8px; }
.sub-b .doc p { margin: 0 0 6px; }
.sub-b .doc p:last-child { margin-bottom: 0; }
button.bcard-title::before { content: "▸"; display: inline-block; width: 1.2em; color: var(--bb); }
button.bcard-title[aria-expanded="true"]::before { content: "▾"; }
button.bcard-title { cursor: pointer; }

/* 덜 중요한 내용을 따로 묶은 참고 카드와 각주 이동 강조 */
.bcard-aside { background: transparent; border: 1px dashed var(--bl); }
.bcard-aside .bcard-head { background: none; border-bottom: 1px dashed var(--bl); }
.bcard-aside button.bcard-title { font-size: 14px; color: var(--bm); }
sup.fn { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
sup.fn:focus-visible { outline: 2px solid var(--bb); outline-offset: 2px; }
.fn-cell { transition: background .3s; }
.fn-flash { background: var(--by); }

/* 브리프 바로 가기: 번호 + 제목 + 화살표가 있는 줄 단추 */
.brief-nav { flex: 0 0 230px; background: var(--bg2); border: 1px solid var(--bl); padding: 10px; display: grid; gap: 6px; position: sticky; top: 8px; align-self: flex-start; }
.brief-nav-title { font-size: 12px; font-weight: 700; color: var(--bm); padding: 0 2px 4px; letter-spacing: .04em; }
button.brief-nav-item { display: grid; grid-template-columns: 24px minmax(0, 1fr) 14px; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--bl); background: var(--bs); color: var(--bt); padding: 8px 10px; font-weight: 500; font-size: 13px; line-height: 1.4; cursor: pointer; }
.nav-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: var(--bn); color: var(--bg2); font-weight: 700; font-size: 12px; }
.nav-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nav-go { color: var(--bm); font-size: 18px; text-align: right; }
button.brief-nav-item:hover { border-color: var(--bb); background: var(--bg2); }
button.brief-nav-item:hover .nav-go { color: var(--bb); }
button.brief-nav-item.is-current { background: var(--bg2); border-color: var(--bb); box-shadow: inset 3px 0 0 var(--bb); font-weight: 700; }
button.brief-nav-item.is-current .nav-num { background: var(--bb); }
button.brief-nav-item.nav-aside { background: transparent; border-style: dashed; color: var(--bm); }
button.brief-nav-item.nav-aside .nav-num { background: var(--bm); }
button.brief-nav-item:focus-visible { outline: 2px solid var(--bb); outline-offset: 1px; }
@media (max-width: 720px) { .brief-nav { position: static; flex-basis: 100%; } }

.form > button[type="submit"], .form > button.primary { justify-self: start; }

<script>window.DEMO_DOCS=[{"kind":"trend_brief","version":5,"createdAt":"2026-10-22","body":"---\nid: trend-brief-202610-us-other-01-v5\ntype: trend_brief_draft\nresearch_id: 202610-us-other-01\ncreated_at: 2026-10-22\nstatus: draft\n---\n\n# 트렌드 브리프 (초안): 미국 선케어 진출 가능 여부와 진출 방식\n> **한 줄 결론** 조건부로 가능해요. 미국은 선케어를 일반의약품으로 관리하기 때문에 제약사라는 점이 강점이 될 수 있어요. 다만 한국 선케어에 많이 쓰이는 자외선 차단 성분 상당수가 미국에서는 아직 허용되지 않았어요.[^2]\n> 가능성: 조건부\n> AI가 쓴 초안이에요. 문장 끝의 작은 번호가 근거이고, 번호를 누르면 카드 아래 표의 해당 출처로 이동해요. 링크는 직접 열어서 확인해 주세요.\n\n## 조사에 쓴 의뢰 기업 정보\n기업 이름은 쓰지 않았고, 일반화한 내용만 사용했어요.\n\n- **의뢰 질문:** 미국 선케어에 진출할 수 있는지, 어떤 방식으로 진출할지.\n- **기업:** ███████ ███ ██ ████ ███ ████ █████ █████.\n- **포지셔닝:** ██ ████, ██████ ███ ███ ████.\n- **타깃:** ██████ ██ █████ ███ ███, ████ ██ █████.\n- **강점과 제약:** ███ ███ ██ ██ ███ ███. ██ ███ ███ ███ ████.\n- **이미 아는 것:** █████ ████ ████ ████ ███ ███ ███ ███.\n\n```diagram matrix\ntitle: 우리 의뢰 기업과 트렌드의 적합성 (AI 판단)\ncols: 트렌드1 | 트렌드2 | 트렌드3 | 트렌드4\nlegend: ● 도움이 돼요 · △ 확인·보완 필요 · – 관계 적음\n제약사·인증 보유 | ● | – | – | ●\n자체 생산 설비 | ● | – | △ | ●\n성분·전문가 추천 강조 | – | ● | – | –\n인력 부족 | △ | – | – | △\n마케팅 경험 부족 | – | △ | △ | –\n```\n\n## 트렌드 1. 미국이 20년 넘어 처음으로 새 자외선 차단 성분을 허용했어요 {적합: 조건부}\n**무슨 일이에요.** FDA가 2026년 6월 바이모트리지놀(Tinosorb S)을 OTC 선케어 허용 성분에 추가했고, 2026년 8월 9일부터 효력이 생겨요.[^1] 광범위 차단 제품에 최대 6%까지, 6개월 이상 어린이와 성인에게 쓸 수 있어요.[^1] 최종 명령 번호와 효력일은 시험·인증 회사인 SGS의 안내에도 나와 있어요.[^3]\n\n```diagram timeline\ntitle: 규제의 창 타임라인\n2026-06 | FDA 최종 명령 | 바이모트리지놀 허용 확정[^3]\n2026-08-09 | 효력 시작 | 신청 회사(DSM)의 18개월 독점 시작[^1]\n2028-02경 (계산값) | 독점 종료 예상 | 8/9 + 18개월. 원문으로 조건 확인 필요 | warn\n2028 이후 | 다른 제조사에도 퍼질 전망 | 로펌 해석[^1] | gray\n```\n\n**단서.** 신청 회사가 18개월 독점권을 가져서, 다른 회사가 널리 쓰는 건 2028년 이후가 될 거라는 해석이 있어요.[^1] 영국 화장품협회도 같은 변경을 공지했어요.[^4]\n\n**성분이 다 풀린 건 아니에요.** 한국 선케어에 흔한 성분 네 가지는 아직 미국에서 허용되지 않았어요.[^2]\n\n```diagram chips\ntitle: 성분 신호등: 한국 선케어에 흔한 성분의 미국 상태\n바이모트리지놀 (Tinosorb S) | 허용 · 최대 6% · 독점 기간 | ok\nUvinul A Plus | 아직 미승인 | warn\nUvinul T150 | 아직 미승인 | warn\nTinosorb M | 아직 미승인 | warn\nUvasorb HEB | 아직 미승인 | warn\n```\n\n**카드와의 적합성: 조건부.** 제약사는 새 성분을 쓰는 데 필요한 시험과 생산 역량이 있어서 유리해요. 다만 독점 기간에는 라이선스나 공급 계약이 필요할 가능성이 높고, 이 부분은 확인이 필요해요.\n\n**출처 간 차이.** 독점권을 가진 회사로 한 곳은 DSM을, 다른 곳은 BASF가 이 성분을 적극 홍보한다고 적었어요. 두 회사의 관계는 확인하지 못했어요. FDA 최종 명령 원문도 열어 보지 못했어요.\n\n[^1]: Venable, 바이모트리지놀 정리 | https://www.venable.com/insights/publications/2026/06/fda-clears-the-way-for-bemotrizinol-first-new-otc | 2026-06 | 로펌 해설 | 2차 | 열람 |\n[^2]: Korea Times, 신규 UV 필터와 K뷰티 | https://www.koreatimes.co.kr/world/20260813/us-finally-approves-new-uv-filter-can-it-catch-up-with-k-beauty | 2026-08-13 | 언론 | 2차 | 원문확인 | which are still unavailable as approved active ingredients in the United States\n[^3]: SGS 안내문 | https://www.sgs.com/en/news/2026/06/safeguards-08326-fda-adds-bemotrizinol-to-otc-sunscreen-monograph | 2026-06 | 시험·인증 회사 | 2차 | 검색요약 |\n[^4]: CTPA(영국 화장품협회) 공지 | https://www.ctpa.org.uk/news/fda-adds-bemotrizinol-to-permitted-sunscreen-active-ingredients-in-the-us-9096 | 2026-06-12 | 업계 협회 | 2차 | 검색요약 |\n\n## 트렌드 2. 선케어가 \"매일 바르는 스킨케어\"가 되고 있어요 {적합: 맞음}\n미국 소비자는 선케어를 계절 상품이 아니라 아침 루틴의 일부로 봐요.[^5] 틴티드(색이 들어간 제품), 보습제 겸용(하이브리드), 스틱, 미네랄 제품이 커지고 있다고 해요.[^5] 미국 틴티드 시장을 약 1억 6,900만 달러로 추정한 유료 보고서 소개가 있지만, 방향을 가늠하는 용도로만 봐야 해요.[^6] 스킨케어형 선케어로 옮겨 가는 흐름도 같은 방향이에요.[^7]\n\n```diagram steps\ntitle: 아침 루틴 안에서 선케어의 자리[^5]\n보습\n*선케어(SPF)\n메이크업\n```\n\n```diagram tiles\ntitle: 커지고 있는 형태 4가지 (크기는 미확인, 방향만)\n▲ 틴티드 | 색이 들어가 파운데이션을 대신해요[^5]\n▲ 보습 겸용 | 한 단계를 줄여 줘요[^5]\n▲ 스틱 | 휴대·덧바르기가 쉬워요\n▲ 미네랄 | 순한 이미지, 하얀 잔여감 개선\n```\n\n**출처 한계.** 제가 읽은 글은 마케팅 성격이 강한 분석 블로그 하나뿐이고, 수치는 없었어요. 시장 규모 숫자는 유료 보고서 소개문에서만 봤어요. 방향은 여러 곳이 비슷하지만 크기는 아직 몰라요.\n\n**카드와의 적합성: 맞음.** 카드가 내세우는 \"성분·기능, 전문가 추천·인증\"과 \"전문가에서 업장으로\" 넓히는 계획이 \"피부과 전문의의 설명이 신뢰를 만든다\"는 흐름과 맞아요.\n\n[^5]: Spate, 2026 선케어 트렌드 | https://www.spate.nyc/blog/sun-care-trends-2026-us-market | 2026 | 데이터 분석 회사 블로그 | 2차 | 원문확인 | SPF became part of the morning routine\n[^6]: Straits Research, 틴티드 선케어 | https://straitsresearch.com/report/tinted-sunscreen-market | 2026 | 유료 보고서 소개 | 2차 | 검색요약 |\n[^7]: Global Market Insights, 북미 선케어 | https://www.gminsights.com/industry-analysis/north-america-suncare-products-market | 2026 | 유료 보고서 소개 | 2차 | 검색요약 |\n\n## 트렌드 3. K-선케어는 인기지만 미국에서는 처방을 바꿔야 해요 {적합: 조건부}\n아마존 판매 추정 자료에서 한국식 선케어가 상위권에 올라 있어요.[^8] 다만 업체 한 곳의 추정이고, 한국 제품만 따로 보여 주지도 않아요.[^8] 한국 제품이 인기인 이유로는 가벼운 제형이 자주 꼽혀요. 필터 제약 때문에 미국용은 감촉이 달라질 수 있다는 온라인 반응도 있어요.[^9]\n\n```diagram compare\nleft | 한국에서 인기인 처방 | 여러 필터를 섞은 가벼운 제형. Uvinul A Plus, Uvinul T150, Tinosorb M, Uvasorb HEB 등[^2]\narrow | 미국용으로 재처방\nright | 미국에서 쓸 수 있는 처방 | 허용 성분만으로 구성(징크옥사이드·티타늄디옥사이드 등) + 조건부 바이모트리지놀. 감촉이 달라질 수 있어요[^9]\n```\n\n**출처 1개, 일반화 위험.** 판매 순위는 한 업체의 추정이에요. 한국 선케어가 미국에서 얼마나 팔리는지는 확인하지 못했어요.\n\n**카드와의 적합성: 조건부.** 한국 처방을 그대로 가져가는 전략은 막혀 있어요. 반대로 미국에서 허용된 성분만으로도 가벼운 제형을 만들 수 있다면 차별점이 돼요. 카드에는 그 능력이 적혀 있지 않아서 확인이 필요해요.\n\n[^8]: ASInsight, 한국식 선케어 판매 순위 | https://www.asinsight.com/report/US/korean-sunscreen | 2026-07 | 아마존 판매 추정 업체 | 2차(추정) | 검색요약 |\n[^9]: Korea Times, 신규 UV 필터와 K뷰티 | https://www.koreatimes.co.kr/world/20260813/us-finally-approves-new-uv-filter-can-it-catch-up-with-k-beauty | 2026-08-13 | 언론 | 2차 | 원문확인 | skepticism over how much a single approval would change\n\n## 트렌드 4. 규제 경로가 화장품과 달라요 {적합: 맞음}\n선케어는 비처방 의약품이라 다른 OTC 의약품과 같은 안전·효과 기준을 따라요.[^10] SPF는 시험으로 측정해서 표시하고, 광범위 차단과 내수성(40분 또는 80분) 표시도 시험을 거쳐야 해요. SPF 15 미만이거나 광범위 차단이 아니면 라벨에 경고 문구를 넣어야 해요.[^10]\n\n```diagram compare\nleft | 일반 화장품 경로 | 별도 화장품 시설 등록·제품 목록(MoCRA). 의약품이기도 한 화장품은 이쪽이 아니라 의약품 등록을 적용해요[^13]\nright | 선케어 = OTC 의약품 경로 | 시설 등록 · 제품 목록 · 미국 내 대리인 · 시설 수수료 · SPF 시험 · Drug Facts 라벨[^10][^11][^12]\n```\n\n```diagram steps\ntitle: 미국 선케어 출시까지 5단계\n처방 확정 | 미국 허용 성분으로\n시험 | SPF·광범위·내수성\n시설 등록 | 대리인·제품 목록[^11]\n라벨 | Drug Facts\n판매 | 온라인 → 전문가·업장\nnote: 각 단계에 걸리는 기간은 근거를 찾지 못했어요. 시설 수수료(2026회계연도)는 일반 19,188달러, 위탁생산 12,792달러로 나왔어요(검색 요약).[^12]\n```\n\n제조 시설은 FDA에 의약품 시설 등록과 제품 목록 등록을 해야 하고, 해외 시설은 미국 내 대리인도 지정해야 해요. 등록은 매년 10월 1일부터 12월 31일 사이에 갱신해요.[^11] OMUFA 수수료가 외국 시설에 어떻게 적용되는지는 원문을 확인해야 해요.[^12]\n\n**카드와의 적합성: 맞음.** 제약사가 이미 갖춘 의약품 품질 관리와 인증 경험이 이 경로에서 가장 큰 강점이에요. 다만 카드의 \"인력 부족\"은 규제 절차를 맡을 사람이 필요하다는 뜻이기도 해요.\n\n[^10]: FDA, 선케어 소비자 안내 | https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun | 확인일 2026-10-21 | 정부(FDA) | 1차 | 열람 |\n[^11]: FDA, 의약품 시설 등록 방법 | https://www.fda.gov/drugs/drug-registration-and-listing-instructions/how-register-drug-establishment | - | 정부(FDA) | 1차 | 검색요약 |\n[^12]: Federal Register, OMUFA 2026 수수료 공고 | https://www.govinfo.gov/content/pkg/FR-2026-03-18/html/2026-05276.htm | 2026-03-18 | 정부 공보 | 1차 | 검색요약 |\n[^13]: Sidley, MoCRA 초안 해설 | https://sidley.com/en/insights/newsupdates/2023/08/fda-issues-draft-guidance-on-registration-and-listing-of-cosmetic-product-facilities-and-products | 2023-08 | 로펌 | 2차 | 검색요약 |\n\n## 접근 제안 (가설이에요, 확정이 아니에요)\n의뢰 질문의 \"진출 방식\"을 세 가지 길로 나눠 봤어요. 아래 지도의 위치는 AI의 대략적인 판단이고, 근거는 약해요.\n\n```diagram map\ntitle: 속도와 차별성으로 본 세 가지 길\nx: 속도 빠름\ny: 차별성 높음\nB 바이모트리지놀 | 15 | 85 | gray\nC 위탁생산·파트너 | 45 | 45\nA 승인 성분 처방 | 85 | 15 | ok\n```\n\n| 길 | 내용 | 장점 | 대가·위험 |\n|---|---|---|---|\n| A. 승인된 성분으로 미국용 처방을 따로 만들기 | 지금 허용된 성분(징크옥사이드, 티타늄디옥사이드 등)으로 처방 | 가장 빠르게 시작 가능 | 한국에서 쓰던 가벼운 감촉을 그대로 내기 어려울 수 있음 |\n| B. 바이모트리지놀 쓰기 | 독점 기간 동안 공급·라이선스를 받아 쓰기 | 차별점이 될 수 있음 | 독점 조건과 공급 가능 여부를 확인해야 함(미확인) |\n| C. 미국 위탁생산·현지 파트너 | 미국 시설에서 만들고 등록은 그 시설이 | 한국 시설 등록과 대리인 부담을 줄임 | 품질 통제와 마진을 나눠야 함 |\n\n**서브니치 제안(가설).** 피부과·약사 추천 근거를 내세운 **데일리 틴티드 또는 하이브리드(보습형) 선케어**예요. 무향, 민감 피부 대상, 미네랄 베이스를 생각했어요. 트렌드 2의 방향(매일 쓰기, 틴티드·하이브리드, 전문가 신뢰)이 카드의 강조점과 만나는 지점이에요. 가격은 중가라고 적혀 있지만 근거는 아직 없어요.\n\n```diagram stairs\ntitle: 채널은 이 순서로 넓혀 가요 (카드의 확장 계획)\n① 소비자 온라인 | 먼저 시작\n② 전문가 | 추천 근거 쌓기\n③ 업장 | 마지막 확장\n```\n\n## 제약 대응 전략 (인력 부족, 마케팅 경험 부족)\n**정면으로 해야 하는 것.** 위 5단계(처방 확정 → 시험 → 시설 등록 → 라벨 → 판매)를 모두 거쳐야 해요. 각 단계에 걸리는 기간은 근거를 찾지 못했어요.\n\n**제약을 오히려 파고드는 길.** 신규 브랜드가 쉽게 못 가는 의약품 규제 경로를 이미 아는 제약사라는 점이 신뢰의 근거가 될 수 있어요. 규제 장벽이 높아서 경쟁이 줄어든다는 건 가정이고, 근거는 아직 없어요. 마케팅 경험이 부족하니 광고보다 전문가 추천 중심의 좁은 채널부터 시작하는 쪽이 맞아요.\n\n```diagram hub\ntitle: 준비 계획: 누가 도와야 하나\ncenter | 의뢰 기업 | 인력·마케팅 부족은 외부로 보완\nnode | 미국 규제 전문가 | 시설 등록·라벨\nnode | SPF 시험 기관 | 시험·성적서\nnode | 현지 유통·마케팅 파트너 | 마케팅 경험 보완\n```\n\n```diagram flow\ntitle: 갈림길: 이걸 확인하면 길이 정해져요\nQ1. 현재 시설이 FDA 의약품 시설 등록과 점검을 받을 수 있나요? | 예: 직접 생산 (길 A 또는 B) | 아니오·불확실: 길 C\nQ2. 바이모트리지놀 공급·라이선스를 받을 수 있나요? | 가능: 길 B로 차별화 | 불가능: 길 A로 먼저, 2028년경 재검토\nQ3. 기존 한국 선케어 처방이 미국 허용 성분만으로 되어 있나요? | 예: 시험과 라벨 중심 | 아니오: 처방 재개발 기간이 늘어요\n```\n\n## 더 확인이 필요한 것 {참고}\n**사용자에게 확인할 것**\n1. ███ \"██ ██\"█ ███ ██ ████(██ ███ █████, ███ ██ ███ ███).\n2. ██ ██ ██ ████ ███, ███ ██ ███ ██ ███ ███.\n3. ████ ████ ███ ██ ███.\n4. ██ ███ ██ ██.\n5. ███ ███ ███ ████ ██ ████ ███, ██ ███.\n6. ██ ██(████ \"█ ██\"). ██ ████ ███ ███.\n\n**확인하지 못한 것**\n- FDA 바이모트리지놀 최종 명령 원문과 독점 조건의 정확한 내용.\n- 미국 선케어 시장 규모와 K-선케어 점유율.\n- OMUFA 수수료가 해외 시설에 어떻게 적용되는지, 시설 등록에 드는 정확한 기간과 비용.\n- 선케어 라벨링 규정 원문(21 CFR 201.327)과 시험 기준의 세부.\n- 경쟁 브랜드 사례와 소매 채널(약국, 아마존 등)의 입점 조건.\n- 2026년 7월 FDA 해외 시설 등록 규정 개정안(제안 단계로 보임)이 미치는 영향.\n\n**스스로 짚은 약점**\n- \"규제를 먼저 확인하고 진출하라\"는 결론은 누구나 말할 수 있어요. 이 브리프가 더하는 건 독점 기간(약 2028년까지)과 허용 성분의 한계가 진출 시점과 처방 선택을 가른다는 점이에요.\n- 서브니치 제안은 트렌드와 카드를 이어 만든 가설이고, 소비자 후기나 판매 데이터로는 검증하지 못했어요.\n"}];window.DEMO_SRC={"src/ui/research.js":"// 조사 상세 (WB-05-W, REQ-11, 13). 저장한 결과를 종류별로 모아 보여 주고, 이전 버전도 고를 수 있다.\r\nimport { labelOf, MARKETS, CATEGORIES } from \"../domain/catalog.js\";\r\nimport { parseBrief } from \"../domain/brief_parse.js\";\r\nimport { el, link, renderPage, backBar } from \"./layout.js\";\r\nimport { briefView } from \"./brief_view.js\";\r\n\r\nfunction showBody(view, markdown, doc) {\r\n  view.replaceChildren();\r\n  // 트렌드 브리프는 카드 구조를 읽을 수 있으면 카드로 보여 준다(없으면 일반 글)\r\n  const brief = doc.kind === \"trend_brief\" ? parseBrief(doc.body) : null;\r\n  if (brief) return view.append(briefView(brief, markdown));\r\n  // 글을 HTML로 바꿀 때는 반드시 청소를 거친 변환기만 쓴다. 변환기가 없으면 글자 그대로 보여 준다.\r\n  if (markdown) view.innerHTML = markdown.toHtml(doc.body);\r\n  else view.textContent = doc.body;\r\n}\r\n\r\nfunction versionLabel(doc) {\r\n  return `${doc.version}번째 버전 · ${String(doc.createdAt || \"\").slice(0, 10)}`;\r\n}\r\n\r\nfunction groupCard(group, markdown) {\r\n  const view = el(\"div\", { className: \"doc\" });\r\n  const header = [el(\"h2\", { text: group.label })];\r\n  const render = (doc) => showBody(view, markdown, doc);\r\n  if (group.versions.length > 1) {\r\n    const picker = el(\"select\", { attrs: { \"aria-label\": `${group.label} 버전 고르기` } },\r\n      group.versions.map((doc, index) => el(\"option\", { text: versionLabel(doc) + (index === 0 ? \" (최신)\" : \"\"), attrs: { value: String(index) } })));\r\n    picker.addEventListener(\"change\", () => render(group.versions[Number(picker.value)]));\r\n    header.push(picker);\r\n  } else {\r\n    header.push(el(\"span\", { className: \"muted\", text: versionLabel(group.versions[0]) }));\r\n  }\r\n  render(group.versions[0]);\r\n  return el(\"div\", { className: \"card\" }, [el(\"div\", { className: \"doc-head\" }, header), view]);\r\n}\r\n\r\nfunction emptyCard(id) {\r\n  return el(\"div\", { className: \"card\" }, [\r\n    el(\"p\", { className: \"big\", text: \"아직 저장한 결과가 없어요\" }),\r\n    el(\"p\", { className: \"muted\", text: \"조사 결과는 Claude에서 만든 뒤 여기에 붙여 넣어 저장해요. 저장하면 이 화면에 종류별로 모여요.\" }),\r\n    link(\"결과 붙여넣기\", `#/research/${encodeURIComponent(id)}/paste`, \"button primary\"),\r\n  ]);\r\n}\r\n\r\nexport async function showResearch(root, ctx, researchId) {\r\n  const detail = await ctx.services.docs.loadDetail(researchId);\r\n  if (!detail.ok) {\r\n    return renderPage(root, ctx.onLogout, [backBar(\"#/\"), el(\"h1\", { text: \"조사 상세\" }), el(\"p\", { className: \"error\", text: detail.message })]);\r\n  }\r\n  const { research, groups } = detail;\r\n  const enc = encodeURIComponent(researchId);\r\n  const meta = `${labelOf(MARKETS, research.market)} · ${labelOf(CATEGORIES, research.category)}`;\r\n  renderPage(root, ctx.onLogout, [\r\n    backBar(\"#/\", [link(\"조사 카드\", `#/research/${enc}/card`), link(\"기업 페이지\", `#/client/${encodeURIComponent(research.clientId)}`)]),\r\n    el(\"h1\", { text: researchId }),\r\n    el(\"p\", { className: \"muted\", text: `${meta} · ${research.question || \"의뢰 질문 없음\"}` }),\r\n    groups.length ? link(\"새 결과 붙여넣기\", `#/research/${enc}/paste`, \"button primary\") : null,\r\n    ...(groups.length ? groups.map((group) => groupCard(group, ctx.services.markdown)) : [emptyCard(researchId)]),\r\n  ]);\r\n}\r\n","src/domain/catalog.js":"// 고를 수 있는 값의 목록과 이름. 코드는 조사 번호와 DB에 그대로 저장된다(기존 데이터 eu, us, lip, derma와 같은 방식).\n\nexport const MARKETS = [\n  { code: \"us-ca\", label: \"미국·캐나다\" },\n  { code: \"us\", label: \"미국\" },\n  { code: \"ca\", label: \"캐나다\" },\n  { code: \"eu\", label: \"유럽\" },\n  { code: \"uk\", label: \"영국\" },\n  { code: \"jp\", label: \"일본\" },\n  { code: \"kr\", label: \"한국\" },\n  { code: \"xx\", label: \"기타\" },\n];\n\nexport const CATEGORIES = [\n  { code: \"lip\", label: \"립\" },\n  { code: \"makeup\", label: \"색조\" },\n  { code: \"skincare\", label: \"스킨케어\" },\n  { code: \"derma\", label: \"더마코스메틱\" },\n  { code: \"haircare\", label: \"헤어케어\" },\n  { code: \"other\", label: \"기타\" },\n];\n\nexport const MODES = [\n  { code: \"quick\", label: \"빠른 조사 (1~2일)\" },\n  { code: \"deep\", label: \"깊은 조사 (1주 이상)\" },\n];\n\nconst STATUS_LABELS = { draft: \"작성 중\", active: \"진행 중\", closed: \"끝남\" };\n\nexport function labelOf(list, code) {\n  const found = list.find((item) => item.code === code);\n  return found ? found.label : code || \"\";\n}\n\nexport function statusLabel(status) {\n  return STATUS_LABELS[status] || status || \"\";\n}\n","src/domain/brief_parse.js":"// 트렌드 브리프를 카드 구조로 읽는다(REQ-13). 저장된 글은 그대로 읽을 수 있는 마크다운이고, 아래 약속을 지키면 화면이 카드·각주 표·도식으로 나눈다.\r\n//   # 제목\r\n//   > 한 줄 결론 문장[^1]            (맨 위 인용 첫 줄 = 한 줄 결론, \"가능성: 조건부\" 줄 = 가능성 눈금, 나머지 줄 = 안내문)\r\n//   ## 트렌드 1. 제목 {적합: 조건부}   (## 하나가 카드 하나, {적합: 맞음|조건부|약함}은 선택)\r\n//   본문 문장[^1]\r\n//   ```diagram timeline ... ```       (도식 블록, domain/diagram_parse.js)\r\n//   [^1]: 제목 | 주소 | 날짜 | 출처 종류 | 1차 또는 2차 | 원문확인·열람·검색요약 | 원문 발췌(선택)\r\n//   ## 더 확인이 필요한 것 {참고}      ({참고}를 붙인 카드는 덜 중요한 내용을 따로 묶은 카드로, 흐리게 보인다)\r\n// 각주 정의는 처음 인용한 카드 안에 둔다. ## 카드가 하나도 없으면 null을 돌려주고 화면은 일반 마크다운으로 보여 준다.\r\nimport { parseDiagram } from \"./diagram_parse.js\";\r\n\r\nconst FN_DEF = /^\\[\\^(\\d+)\\]:\\s*(.+)$/;\r\nconst FIT = { 맞음: \"yes\", 조건부: \"cond\", 약함: \"weak\" };\r\nconst STATUS = { 원문확인: \"verified\", 열람: \"read\", 검색요약: \"summary\" };\r\nconst METER_LEVELS = [\"막힘\", \"조건부\", \"가능\"];\r\n\r\nfunction parseDef(number, rest) {\r\n  const [title = \"\", url = \"\", date = \"\", kind = \"\", order = \"\", status = \"\", excerpt = \"\"] = rest.split(\"|\").map((part) => part.trim());\r\n  return { number, title, url, date, kind, order, status: STATUS[status] || \"summary\", excerpt };\r\n}\r\n\r\nfunction plain(sentence) {\r\n  return sentence.replace(/\\[\\^\\d+\\]/g, \"\").replace(/[*`#>]/g, \"\").replace(/^\\s*[-|]\\s*/, \"\").trim();\r\n}\r\n\r\n// 각주를 처음 인용한 문장(없으면 빈 글)\r\nfunction citingSentence(texts, number) {\r\n  const marker = `[^${number}]`;\r\n  for (const text of texts) {\r\n    const found = text.split(\"\\n\").flatMap((line) => line.split(/(?<=\\.(?:\\[\\^\\d+\\])*)\\s+/)).find((part) => part.includes(marker));\r\n    if (found) return plain(found);\r\n  }\r\n  return \"\";\r\n}\r\n\r\nfunction splitHeading(raw) {\r\n  const aside = /\\{참고\\}\\s*$/.test(raw);\r\n  const base = raw.replace(/\\{참고\\}\\s*$/, \"\");\r\n  const match = /\\{적합:\\s*([^}]+)\\}\\s*$/.exec(base);\r\n  const fit = match ? FIT[match[1].trim()] || \"\" : \"\";\r\n  return { heading: base.replace(/\\{적합:[^}]*\\}\\s*$/, \"\").trim(), fit, fitLabel: match ? match[1].trim() : \"\", aside };\r\n}\r\n\r\n// 굵은 글씨로 시작하는 문단(\"**무슨 일이에요.** ...\")은 소제목 상자 하나가 된다. 이어지는 문단·목록·표는 그 상자에 붙는다.\r\nconst LEAD = /^\\*\\*([^*\\n]{2,40}?)[.:：]?\\*\\*\\s*([\\s\\S]*)$/;\r\n\r\nfunction splitLeads(text) {\r\n  const parts = [];\r\n  text.split(/\\n{2,}/).map((paragraph) => paragraph.trim()).filter(Boolean).forEach((paragraph) => {\r\n    const match = LEAD.exec(paragraph);\r\n    const last = parts[parts.length - 1];\r\n    if (match) parts.push({ lead: match[1].trim(), text: match[2].trim(), source: paragraph });\r\n    else if (last) { last.text += `\\n\\n${paragraph}`; last.source += `\\n\\n${paragraph}`; } else parts.push({ lead: \"\", text: paragraph, source: paragraph });\r\n  });\r\n  return parts;\r\n}\r\n\r\n// 카드 안의 줄들을 글 덩어리와 도식 덩어리로 나눈다\r\nfunction toBlocks(lines) {\r\n  const blocks = [];\r\n  let text = [];\r\n  let diagram = null;\r\n  const flush = () => { splitLeads(text.join(\"\\n\")).forEach((part) => blocks.push({ type: \"md\", ...part })); text = []; };\r\n  lines.forEach((line) => {\r\n    const open = /^```diagram\\s+(\\w+)\\s*$/.exec(line);\r\n    if (diagram) {\r\n      if (/^```\\s*$/.test(line)) { blocks.push({ type: \"diagram\", kind: diagram.kind, data: parseDiagram(diagram.kind, diagram.lines) }); diagram = null; } else diagram.lines.push(line);\r\n    } else if (open) { flush(); diagram = { kind: open[1], lines: [] }; } else text.push(line);\r\n  });\r\n  flush();\r\n  return blocks;\r\n}\r\n\r\nfunction readLines(lines) {\r\n  const head = { title: \"\", quote: [] };\r\n  const sections = [];\r\n  let current = null;\r\n  lines.forEach((line) => {\r\n    if (line.startsWith(\"## \")) {\r\n      current = { ...splitHeading(line.slice(3)), lines: [], defs: [] };\r\n      sections.push(current);\r\n    } else if (!current && line.startsWith(\"# \")) head.title = line.slice(2).trim();\r\n    else if (!current && line.startsWith(\">\")) head.quote.push(line.replace(/^>\\s?/, \"\").trim());\r\n    else if (current) {\r\n      const def = FN_DEF.exec(line);\r\n      if (def) current.defs.push(parseDef(Number(def[1]), def[2]));\r\n      else current.lines.push(line);\r\n    }\r\n  });\r\n  return { head, sections };\r\n}\r\n\r\n// 맨 위 인용을 결론, 가능성 눈금, 안내문으로 나눈다\r\nfunction readQuote(quote) {\r\n  const lines = quote.filter(Boolean);\r\n  const meterLine = lines.find((line) => /^\\*{0,2}가능성\\*{0,2}\\s*[:：]/.test(line));\r\n  const rest = lines.filter((line) => line !== meterLine);\r\n  const level = meterLine ? meterLine.replace(/^\\*{0,2}가능성\\*{0,2}\\s*[:：]\\s*/, \"\").trim() : \"\";\r\n  const conclusion = rest.length ? rest[0].replace(/^\\*{0,2}한 줄 결론\\*{0,2}\\s*[:：]?\\s*/, \"\") : \"\";\r\n  return { conclusion, notice: rest.slice(1).join(\" \"), meter: METER_LEVELS.includes(level) ? { levels: METER_LEVELS, at: METER_LEVELS.indexOf(level) } : null };\r\n}\r\n\r\nconst TODO_TITLE = \"사용자에게 확인할 것\";\r\n\r\nfunction listItems(text) {\r\n  return text.split(\"\\n\").filter((line) => /^\\s*(\\d+\\.|[-*])\\s/.test(line)).length;\r\n}\r\n\r\n// 카드 제목이 \"사용자에게 확인할 것\"이거나, 카드 안 소제목 상자가 그 제목이면 목록 개수를 센다\r\nfunction countTodo(sections) {\r\n  return sections.reduce((sum, section) => {\r\n    if (section.heading.startsWith(TODO_TITLE)) return sum + listItems(section.body);\r\n    const boxes = section.blocks.filter((block) => block.type === \"md\" && block.lead.startsWith(TODO_TITLE));\r\n    return sum + boxes.reduce((inner, block) => inner + listItems(block.text), 0);\r\n  }, 0);\r\n}\r\n\r\nfunction summarize(sections) {\r\n  const notes = sections.flatMap((section) => section.footnotes);\r\n  return {\r\n    trends: sections.filter((section) => section.fit).length,\r\n    sources: notes.length,\r\n    verified: notes.filter((note) => note.status === \"verified\").length,\r\n    read: notes.filter((note) => note.status === \"read\").length,\r\n    summary: notes.filter((note) => note.status === \"summary\").length,\r\n    primary: notes.filter((note) => note.order.startsWith(\"1차\")).length,\r\n    todo: countTodo(sections),\r\n  };\r\n}\r\n\r\nexport function parseBrief(text) {\r\n  const { head, sections } = readLines(String(text || \"\").split(/\\r?\\n/));\r\n  if (!sections.length) return null;\r\n  const quote = readQuote(head.quote);\r\n  const parsed = sections.map((section, index) => {\r\n    const blocks = toBlocks(section.lines);\r\n    const body = blocks.filter((block) => block.type === \"md\").map((block) => block.source).join(\"\\n\\n\");\r\n    return { id: `brief-${index + 1}`, heading: section.heading, fit: section.fit, fitLabel: section.fitLabel, aside: section.aside, body, blocks, defs: section.defs, raw: section.lines.join(\"\\n\") };\r\n  });\r\n  const finished = parsed.map((section) => ({\r\n    id: section.id, heading: section.heading, fit: section.fit, fitLabel: section.fitLabel, aside: section.aside, body: section.body, blocks: section.blocks,\r\n    footnotes: section.defs.map((def) => ({ ...def, cites: citingSentence([section.raw, quote.conclusion], def.number) })),\r\n  }));\r\n  return { title: head.title, conclusion: quote.conclusion, notice: quote.notice, meter: quote.meter, stats: summarize(finished), sections: finished };\r\n}\r\n\r\n// 본문의 [^n]을 화면용 위첨자 표시로 바꾼다(청소기를 거치기 전 글)\r\nexport function withFootnoteMarks(markdown) {\r\n  return String(markdown || \"\").replace(/\\[\\^(\\d+)\\]/g, '<sup class=\"fn\">$1</sup>');\r\n}\r\n","src/domain/diagram_parse.js":"// 브리프 글 안의 도식 블록을 읽는다(REQ-13). 글에는 아래처럼 쓴다.\n//   ```diagram timeline\n//   title: 제목(선택)\n//   2026-06 | FDA 최종 명령 | 설명 | warn(선택)\n//   ```\n// 종류: timeline steps compare chips matrix flow map stairs hub tiles. 칸은 | 로 나누고, 모르는 종류나 모양이 맞지 않으면 null이다.\n// 글자만 돌려주고 화면 모양(색, 위치)은 ui가 정한다.\n\nexport const DIAGRAM_KINDS = [\"timeline\", \"steps\", \"compare\", \"chips\", \"matrix\", \"flow\", \"map\", \"stairs\", \"hub\", \"tiles\"];\nconst TONES = [\"ok\", \"warn\", \"gray\"];\nconst MATRIX_MARK = { \"●\": \"yes\", \"△\": \"check\", \"–\": \"none\", \"-\": \"none\" };\n\nfunction cells(line) {\n  return line.split(\"|\").map((part) => part.trim());\n}\n\nfunction tone(value) {\n  return TONES.includes(value) ? value : \"\";\n}\n\n// \"키: 값\" 줄은 옵션으로, 나머지는 행으로 나눈다\nfunction split(lines) {\n  const options = {};\n  const rows = [];\n  lines.forEach((line) => {\n    const option = /^(title|note|x|y|cols|legend)\\s*:\\s*(.*)$/.exec(line);\n    if (option) options[option[1]] = option[2].trim();\n    else if (line.trim()) rows.push(cells(line));\n  });\n  return { options, rows };\n}\n\nfunction branch(text, positive) {\n  const [label = \"\", ...rest] = String(text || \"\").split(\":\");\n  return { label: label.trim(), text: rest.join(\":\").trim(), tone: positive ? \"ok\" : \"warn\" };\n}\n\nfunction percentStep(value) {\n  const number = Number(value);\n  if (!Number.isFinite(number)) return 5;\n  return Math.min(10, Math.max(0, Math.round(number / 10)));\n}\n\nconst BUILD = {\n  timeline: (rows) => ({ items: rows.map(([label, title, note, t]) => ({ label, title, note: note || \"\", tone: tone(t) })) }),\n  steps: (rows) => ({ items: rows.map(([title, note]) => ({ title: title.replace(/^\\*\\s*/, \"\"), note: note || \"\", hot: title.startsWith(\"*\") })) }),\n  chips: (rows) => ({ items: rows.map(([name, note, status]) => ({ name, note: note || \"\", tone: tone(status) || \"gray\" })) }),\n  tiles: (rows) => ({ items: rows.map(([title, note]) => ({ title, note: note || \"\" })) }),\n  stairs: (rows) => ({ items: rows.map(([label, note]) => ({ label, note: note || \"\" })) }),\n  flow: (rows) => ({ items: rows.map(([question, yes, no]) => ({ question, yes: branch(yes, true), no: branch(no, false) })) }),\n  map: (rows) => ({ items: rows.map(([name, x, y, t]) => ({ name, x: percentStep(x), y: percentStep(y), tone: tone(t) })) }),\n};\n\nfunction buildCompare(rows) {\n  const find = (key) => rows.find((row) => row[0] === key) || [];\n  const [, leftTitle = \"\", leftText = \"\"] = find(\"left\");\n  const [, rightTitle = \"\", rightText = \"\"] = find(\"right\");\n  return { left: { title: leftTitle, text: leftText }, right: { title: rightTitle, text: rightText }, arrow: (find(\"arrow\")[1] || \"\") };\n}\n\nfunction buildMatrix(rows, options) {\n  const cols = cells(options.cols || \"\");\n  const body = rows.map(([label, ...marks]) => ({ label, marks: cols.map((_, i) => MATRIX_MARK[marks[i]] || \"none\") }));\n  return { cols, rows: body, legend: options.legend || \"\" };\n}\n\nfunction buildHub(rows) {\n  const center = rows.find((row) => row[0] === \"center\") || [];\n  const nodes = rows.filter((row) => row[0] === \"node\").map(([, title, note]) => ({ title, note: note || \"\" }));\n  return { center: { title: center[1] || \"\", note: center[2] || \"\" }, nodes };\n}\n\nexport function parseDiagram(kind, lines) {\n  if (!DIAGRAM_KINDS.includes(kind)) return null;\n  const { options, rows } = split(lines);\n  let data;\n  if (kind === \"compare\") data = buildCompare(rows);\n  else if (kind === \"matrix\") data = buildMatrix(rows, options);\n  else if (kind === \"hub\") data = buildHub(rows);\n  else data = BUILD[kind](rows);\n  const empty = data.items ? data.items.length === 0 : false;\n  if (empty) return null;\n  return { kind, title: options.title || \"\", note: options.note || \"\", axisX: options.x || \"\", axisY: options.y || \"\", ...data };\n}\n","src/ui/layout.js":"// 화면 공통 도구. 글자는 textContent로만 넣어서 입력값이 코드로 실행되지 않게 한다.\n\nexport function el(tag, options = {}, children = []) {\n  const node = document.createElement(tag);\n  if (options.className) node.className = options.className;\n  if (options.text !== undefined) node.textContent = options.text;\n  if (options.attrs) {\n    Object.entries(options.attrs).forEach(([name, value]) => node.setAttribute(name, value));\n  }\n  children.filter(Boolean).forEach((child) => node.append(child));\n  return node;\n}\n\nexport function clear(root) {\n  root.replaceChildren();\n}\n\nexport function link(text, href, className = \"link\") {\n  return el(\"a\", { className, text, attrs: { href } });\n}\n\n// 결과 문장 한 줄(성공은 보통 글씨, 오류는 빨강, 경고는 노랑 상자)\nexport function messageBox() {\n  return el(\"div\", { className: \"messages\", attrs: { role: \"status\" } });\n}\n\nexport function showMessage(box, message, kind = \"ok\") {\n  const className = kind === \"warn\" ? \"notice\" : kind === \"error\" ? \"error\" : \"okmsg\";\n  box.replaceChildren();\n  if (message) box.append(el(\"p\", { className, text: message }));\n}\n\n// 화면 위쪽 안내 띄우기(저장했는지 바로 보이게). 몇 초 뒤 저절로 사라진다.\nexport function toast(text, kind = \"ok\") {\n  const old = document.querySelector(\".toast\");\n  if (old) old.remove();\n  const node = el(\"div\", { className: kind === \"ok\" ? \"toast\" : \"toast warn\", text, attrs: { role: \"status\" } });\n  document.body.append(node);\n  setTimeout(() => node.remove(), 4000);\n}\n\n// 위쪽 길잡이: \"← 뒤로\"는 방금 있던 화면으로, 나머지 링크는 따로 둔다.\nexport function backBar(fallbackHref, extraLinks = []) {\n  const back = el(\"button\", { className: \"back\", text: \"← 뒤로\" });\n  back.addEventListener(\"click\", () => {\n    if (window.history.length > 1) window.history.back();\n    else location.hash = fallbackHref;\n  });\n  return el(\"div\", { className: \"backbar\" }, [back, ...extraLinks]);\n}\n\nfunction navLink(text, href, active) {\n  return link(text, href, active ? \"nav-link active\" : \"nav-link\");\n}\n\nexport function renderTopbar(onLogout) {\n  const logout = el(\"button\", { text: \"로그아웃\" });\n  logout.addEventListener(\"click\", onLogout);\n  const here = location.hash || \"#/\";\n  const onClients = here.startsWith(\"#/client\");\n  const onHome = here === \"#/\" || here === \"#\" || here === \"\";\n  return el(\"div\", { className: \"topbar\" }, [\n    el(\"div\", { className: \"brand\", text: \"시장조사 컨설턴트 사이트\" }),\n    el(\"nav\", { className: \"nav\" }, [navLink(\"홈\", \"#/\", onHome), navLink(\"의뢰 기업\", \"#/clients\", onClients), logout]),\n  ]);\n}\n\n// 상단 메뉴가 붙은 한 쪽을 그린다\nexport function renderPage(root, onLogout, children) {\n  clear(root);\n  root.append(renderTopbar(onLogout), ...children.filter(Boolean));\n}\n\nexport function renderProblem(root, message) {\n  clear(root);\n  root.append(\n    el(\"div\", { className: \"login-wrap\" }, [\n      el(\"div\", { className: \"card\" }, [\n        el(\"h1\", { text: \"화면을 열지 못했어요\" }),\n        el(\"p\", { className: \"muted\", text: message }),\n      ]),\n    ]),\n  );\n}\n","src/ui/brief_view.js":"// 트렌드 브리프 도식 보기(디자인 C안 + A안의 각주 표, REQ-13): 결론·가능성 눈금·숫자 타일, 근거 믿음 막대, 섹션 카드(글+도식), 카드 아래 근거·원문 비교 표.\r\nimport { withFootnoteMarks } from \"../domain/brief_parse.js\";\r\nimport { el } from \"./layout.js\";\r\nimport { SIMPLE, line } from \"./diagrams.js\";\r\nimport { MORE } from \"./diagrams_more.js\";\r\nimport { footnoteTable } from \"./brief_notes.js\";\r\n\r\nconst FIT_TEXT = { yes: \"카드와 맞음\", cond: \"카드와 조건부\", weak: \"카드와 약함\" };\r\nconst DRAWERS = { ...SIMPLE, ...MORE };\r\n\r\nfunction markedBody(markdown, body) {\r\n  const box = el(\"div\", { className: \"doc\" });\r\n  const source = withFootnoteMarks(body);\r\n  // 청소를 거친 변환기만 쓴다. 없으면 글자 그대로 보여 준다.\r\n  if (markdown) box.innerHTML = markdown.toHtml(source);\r\n  else box.textContent = body;\r\n  return box;\r\n}\r\n\r\n// 소제목이 있는 상자: 위에 얇은 제목 줄, 아래에 내용\r\nfunction subBox(title, children) {\r\n  return el(\"section\", { className: \"sub\" }, [title ? line(\"sub-h\", title) : null, el(\"div\", { className: \"sub-b\" }, children)]);\r\n}\r\n\r\nfunction diagramBlock(block) {\r\n  const data = block.data;\r\n  if (!data) return el(\"div\", { className: \"mut\", text: `도식을 읽지 못했어요(종류: ${block.kind})` });\r\n  const parts = [el(\"figure\", { className: `dg dg-${data.kind}-wrap` }, [DRAWERS[data.kind](data)])];\r\n  if (data.note) parts.push(line(\"mut\", data.note));\r\n  return subBox(data.title, parts);\r\n}\r\n\r\nfunction blockNode(block, markdown) {\r\n  if (block.type === \"diagram\") return diagramBlock(block);\r\n  const body = markedBody(markdown, block.text);\r\n  return block.lead ? subBox(block.lead, [body]) : body;\r\n}\r\n\r\nfunction cardHead(section, toggle) {\r\n  const badges = [];\r\n  if (section.fit) badges.push(el(\"span\", { className: `fit fit-${section.fit}`, text: FIT_TEXT[section.fit] }));\r\n  if (section.footnotes.length) badges.push(el(\"span\", { className: \"count\", text: `근거 ${section.footnotes.length}개` }));\r\n  return el(\"div\", { className: \"bcard-head\" }, [toggle, el(\"div\", { className: \"bcard-badges\" }, badges)]);\r\n}\r\n\r\nfunction sectionCard(section, markdown) {\r\n  const toggle = el(\"button\", { className: \"bcard-title\", text: section.heading, attrs: { type: \"button\", \"aria-expanded\": \"false\" } });\r\n  const body = el(\"div\", { className: \"bcard-body\" }, section.blocks.map((block) => blockNode(block, markdown)));\r\n  if (section.footnotes.length) body.append(footnoteTable(section.footnotes));\r\n  body.hidden = true;\r\n  const card = el(\"section\", { className: section.aside ? \"bcard bcard-aside\" : section.fit ? \"bcard bcard-trend\" : \"bcard\", attrs: { id: section.id } }, [cardHead(section, toggle), body]);\r\n  const setOpen = (value) => { body.hidden = !value; toggle.setAttribute(\"aria-expanded\", String(value)); };\r\n  toggle.addEventListener(\"click\", () => setOpen(body.hidden));\r\n  return { card, setOpen };\r\n}\r\n\r\n// 바로 가기: 번호 표시 + 제목 + 화살표가 있는 줄 단추. 지금 보고 있는 카드는 따로 표시한다.\r\nfunction navLabel(heading) {\r\n  return heading.replace(/^트렌드\\s*(\\d+)\\.\\s*/, \"\");\r\n}\r\n\r\nfunction navBadge(heading) {\r\n  const match = /^트렌드\\s*(\\d+)/.exec(heading);\r\n  return match ? match[1] : \"·\";\r\n}\r\n\r\nfunction navItem(item) {\r\n  const button = el(\"button\", { className: item.section.aside ? \"brief-nav-item nav-aside\" : \"brief-nav-item\", attrs: { type: \"button\" } }, [\r\n    el(\"span\", { className: \"nav-num\", text: navBadge(item.section.heading), attrs: { \"aria-hidden\": \"true\" } }),\r\n    el(\"span\", { className: \"nav-text\", text: navLabel(item.section.heading) }),\r\n    el(\"span\", { className: \"nav-go\", text: \"›\", attrs: { \"aria-hidden\": \"true\" } }),\r\n  ]);\r\n  button.addEventListener(\"click\", () => { item.setOpen(true); item.card.scrollIntoView({ behavior: \"smooth\", block: \"start\" }); });\r\n  return button;\r\n}\r\n\r\n// 화면 위쪽에 걸린 카드를 따라 바로 가기의 \"지금 여기\"가 바뀐다\r\nfunction trackCurrent(cards, buttons) {\r\n  if (typeof IntersectionObserver === \"undefined\") return;\r\n  const observer = new IntersectionObserver((entries) => {\r\n    entries.filter((entry) => entry.isIntersecting).forEach((entry) => {\r\n      const index = cards.findIndex((item) => item.card === entry.target);\r\n      buttons.forEach((button, i) => button.classList.toggle(\"is-current\", i === index));\r\n    });\r\n  }, { rootMargin: \"-10% 0px -75% 0px\" });\r\n  cards.forEach((item) => observer.observe(item.card));\r\n}\r\n\r\nfunction navList(cards) {\r\n  const buttons = cards.map(navItem);\r\n  trackCurrent(cards, buttons);\r\n  return el(\"nav\", { className: \"brief-nav\", attrs: { \"aria-label\": \"이 브리프에서 바로 가기\" } }, [el(\"div\", { className: \"brief-nav-title\", text: \"바로 가기\" }), ...buttons]);\r\n}\r\n\r\nfunction meterBox(meter) {\r\n  const cells = meter.levels.map((label, index) => el(\"div\", { className: index === meter.at ? \"meter-cell meter-on\" : \"meter-cell\" }));\r\n  const names = meter.levels.map((label, index) => el(\"div\", { className: index === meter.at ? \"meter-name meter-on\" : \"meter-name\", text: index === meter.at ? `▲ ${label} (지금 여기)` : label }));\r\n  return el(\"div\", { className: \"meter\" }, [el(\"div\", { className: \"meter-title\", text: \"진출 가능성 (AI 판단, 확정 아님)\" }), el(\"div\", { className: \"meter-bar\" }, cells), el(\"div\", { className: \"meter-names\" }, names)]);\r\n}\r\n\r\nfunction heroTiles(stats) {\r\n  const tiles = [[\"트렌드\", stats.trends], [\"근거(출처)\", stats.sources], [\"원문 문장 확인\", stats.verified], [\"사용자가 확인할 것\", stats.todo]].filter(([, value]) => value > 0);\r\n  return el(\"div\", { className: \"bhero-tiles\" }, tiles.map(([label, value], index) => el(\"div\", { className: `bhero-tile bhero-tile-${index + 1}` }, [el(\"b\", { text: String(value) }), el(\"span\", { text: label })])));\r\n}\r\n\r\nfunction hero(brief, markdown) {\r\n  const left = el(\"div\", { className: \"bhero-main\" }, [\r\n    el(\"div\", { className: \"bhero-label\", text: \"한 줄 결론\" }),\r\n    brief.conclusion ? markedBody(markdown, brief.conclusion) : null,\r\n    brief.meter ? meterBox(brief.meter) : null,\r\n  ]);\r\n  return el(\"div\", { className: \"bhero\" }, [left, heroTiles(brief.stats)]);\r\n}\r\n\r\nfunction evidenceBar(stats) {\r\n  if (!stats.sources) return null;\r\n  const cell = (kind, count) => Array.from({ length: count }, () => el(\"span\", { className: `ev-cell ev-${kind}` }));\r\n  const bar = el(\"div\", { className: \"ev-bar\", attrs: { role: \"img\", \"aria-label\": `근거 ${stats.sources}개: 원문 확인 ${stats.verified}, 열람 ${stats.read}, 검색 요약만 ${stats.summary}` } },\r\n    [...cell(\"verified\", stats.verified), ...cell(\"read\", stats.read), ...cell(\"summary\", stats.summary)]);\r\n  return el(\"div\", { className: \"ev-box\" }, [\r\n    el(\"div\", { className: \"dg-title\", text: \"근거는 얼마나 믿을 만한가\" }), bar,\r\n    el(\"div\", { className: \"mut\", text: `원문 문장 확인 ${stats.verified} · 열람(요약본) ${stats.read} · 검색 요약만 ${stats.summary} · 1차 출처(정부·공보) ${stats.primary}` }),\r\n  ]);\r\n}\r\n\r\n// 본문의 작은 번호를 누르면 그 근거 줄로 이동한다(닫힌 카드는 열고, 줄을 잠깐 강조)\r\nfunction wireFootnotes(root, cards) {\r\n  const goTo = (number) => {\r\n    const owner = cards.find((item) => item.section.footnotes.some((note) => note.number === number));\r\n    const target = root.querySelector(`#fn-${number}`);\r\n    if (!owner || !target) return;\r\n    owner.setOpen(true);\r\n    target.scrollIntoView({ behavior: \"smooth\", block: \"center\" });\r\n    const cells = root.querySelectorAll(`[data-fn=\"${number}\"]`);\r\n    cells.forEach((cell) => cell.classList.add(\"fn-flash\"));\r\n    setTimeout(() => cells.forEach((cell) => cell.classList.remove(\"fn-flash\")), 2200);\r\n  };\r\n  root.querySelectorAll(\"sup.fn\").forEach((mark) => {\r\n    const number = Number(mark.textContent);\r\n    mark.setAttribute(\"role\", \"button\");\r\n    mark.setAttribute(\"tabindex\", \"0\");\r\n    mark.setAttribute(\"title\", `근거 ${number} 보기`);\r\n    mark.setAttribute(\"aria-label\", `근거 ${number}번 보기`);\r\n    mark.addEventListener(\"click\", () => goTo(number));\r\n    mark.addEventListener(\"keydown\", (event) => { if (event.key === \"Enter\" || event.key === \" \") { event.preventDefault(); goTo(number); } });\r\n  });\r\n}\r\n\r\nexport function briefView(brief, markdown) {\r\n  const cards = brief.sections.map((section) => ({ section, ...sectionCard(section, markdown) }));\r\n  const toggleAll = el(\"button\", { className: \"link-button\", text: \"모두 펼치기\", attrs: { type: \"button\" } });\r\n  let allOpen = false;\r\n  toggleAll.addEventListener(\"click\", () => {\r\n    allOpen = !allOpen;\r\n    cards.forEach((item) => item.setOpen(allOpen));\r\n    toggleAll.textContent = allOpen ? \"모두 접기\" : \"모두 펼치기\";\r\n  });\r\n  const notice = brief.notice ? el(\"div\", { className: \"notice\", text: brief.notice }) : null;\r\n  const list = el(\"div\", { className: \"bcards\" }, [evidenceBar(brief.stats), toggleAll, ...cards.map((item) => item.card)]);\r\n  const root = el(\"div\", { className: \"brief\" }, [hero(brief, markdown), notice, el(\"div\", { className: \"brief-layout\" }, [navList(cards), list])]);\r\n  wireFootnotes(root, cards);\r\n  return root;\r\n}\r\n","src/ui/diagrams.js":"// 브리프 도식 그리기(1): 타임라인, 단계, 비교, 성분 신호등, 타일, 계단. 글자는 모두 textContent로 넣는다.\nimport { el } from \"./layout.js\";\n\n// 글 속 [^n]을 위첨자 번호로 바꾼 노드들(HTML을 쓰지 않는다)\nexport function inline(text) {\n  return String(text || \"\").split(/(\\[\\^\\d+\\])/).filter(Boolean).map((part) => {\n    const match = /^\\[\\^(\\d+)\\]$/.exec(part);\n    return match ? el(\"sup\", { className: \"fn\", text: match[1] }) : document.createTextNode(part);\n  });\n}\n\nexport function line(className, text) {\n  const node = el(\"div\", { className });\n  node.append(...inline(text));\n  return node;\n}\n\nfunction tonedClass(base, tone) {\n  return tone ? `${base} tone-${tone}` : base;\n}\n\nfunction timeline(data) {\n  const items = data.items.map((item) => el(\"div\", { className: tonedClass(\"tl-item\", item.tone) }, [\n    line(\"tl-label\", item.label), el(\"div\", { className: \"tl-dot\" }), line(\"tl-title\", item.title), line(\"mut\", item.note),\n  ]));\n  return el(\"div\", { className: \"dg-timeline\" }, items);\n}\n\nfunction steps(data) {\n  const out = [];\n  data.items.forEach((item, index) => {\n    if (index) out.push(el(\"div\", { className: \"st-arrow\", text: \"▶\", attrs: { \"aria-hidden\": \"true\" } }));\n    out.push(el(\"div\", { className: item.hot ? \"st-item st-hot\" : \"st-item\" }, [\n      el(\"span\", { className: \"st-num\", text: String(index + 1) }), line(\"st-title\", item.title), line(\"mut\", item.note),\n    ]));\n  });\n  return el(\"div\", { className: \"dg-steps\" }, out);\n}\n\nfunction compare(data) {\n  const box = (side, className) => el(\"div\", { className }, [line(\"cp-title\", side.title), line(\"mut\", side.text)]);\n  const arrow = el(\"div\", { className: \"cp-arrow\" }, [line(\"\", data.arrow || \"\"), el(\"span\", { text: \"▶\", attrs: { \"aria-hidden\": \"true\" } })]);\n  return el(\"div\", { className: \"dg-compare\" }, [box(data.left, \"cp-left\"), arrow, box(data.right, \"cp-right\")]);\n}\n\nfunction chips(data) {\n  const cards = data.items.map((item) => el(\"div\", { className: tonedClass(\"chipcard\", item.tone) }, [\n    line(\"cp-title\", item.name), line(\"mut\", item.note),\n  ]));\n  return el(\"div\", { className: \"dg-chips\" }, cards);\n}\n\nfunction tiles(data) {\n  return el(\"div\", { className: \"dg-tiles\" }, data.items.map((item) => el(\"div\", { className: \"tile-card\" }, [line(\"tile-title\", item.title), line(\"mut\", item.note)])));\n}\n\nfunction stairs(data) {\n  const bars = data.items.map((item, index) => el(\"div\", { className: `stair stair-h${Math.min(index + 1, 5)}` }, [line(\"stair-label\", item.label), line(\"stair-note\", item.note)]));\n  return el(\"div\", { className: \"dg-stairs\" }, bars);\n}\n\nexport const SIMPLE = { timeline, steps, compare, chips, tiles, stairs };\n","src/ui/diagrams_more.js":"// 브리프 도식 그리기(2): 행렬, 갈림길, 2×2 지도, 허브. 위치는 정해 둔 클래스로만 정한다(화면 보안 규칙상 직접 스타일 값을 넣지 않는다).\nimport { el } from \"./layout.js\";\nimport { line } from \"./diagrams.js\";\n\nconst MARK = { yes: \"●\", check: \"△\", none: \"–\" };\n\nfunction matrix(data) {\n  const head = el(\"tr\", {}, [el(\"th\", { text: \"\" }), ...data.cols.map((col) => el(\"th\", { text: col }))]);\n  const rows = data.rows.map((row) => el(\"tr\", {}, [\n    el(\"th\", { className: \"mk-label\", text: row.label, attrs: { scope: \"row\" } }),\n    ...row.marks.map((mark) => el(\"td\", { className: `mk-${mark}`, text: MARK[mark], attrs: { \"aria-label\": { yes: \"도움이 돼요\", check: \"확인 필요\", none: \"관계 적음\" }[mark] } })),\n  ]));\n  const table = el(\"table\", { className: \"dg-matrix\" }, [el(\"thead\", {}, [head]), el(\"tbody\", {}, rows)]);\n  return el(\"div\", { className: \"dg-scroll\" }, [table, data.legend ? el(\"div\", { className: \"mut\", text: data.legend }) : null]);\n}\n\nfunction flow(data) {\n  const rows = data.items.map((item) => el(\"div\", { className: \"fl-row\" }, [\n    line(\"fl-q\", item.question),\n    el(\"div\", { className: \"st-arrow\", text: \"▶\", attrs: { \"aria-hidden\": \"true\" } }),\n    el(\"div\", { className: \"fl-yes\" }, [el(\"span\", { className: \"fl-tag\", text: item.yes.label }), line(\"\", item.yes.text)]),\n    el(\"div\", { className: \"fl-no\" }, [el(\"span\", { className: \"fl-tag\", text: item.no.label }), line(\"\", item.no.text)]),\n  ]));\n  return el(\"div\", { className: \"dg-flow\" }, rows);\n}\n\nfunction map(data) {\n  const dots = data.items.map((item) => el(\"div\", { className: `map-dot px-${item.x} py-${item.y}${item.tone ? ` tone-${item.tone}` : \"\"}`, text: item.name }));\n  return el(\"div\", { className: \"dg-map\" }, [\n    el(\"div\", { className: \"map-axis-y\", text: data.axisY ? `${data.axisY} ▲` : \"\" }),\n    el(\"div\", { className: \"map-axis-x\", text: data.axisX ? `${data.axisX} ▶` : \"\" }),\n    ...dots,\n  ]);\n}\n\nfunction hub(data) {\n  const half = Math.ceil(data.nodes.length / 2);\n  const node = (item) => el(\"div\", { className: \"hub-node\" }, [line(\"cp-title\", item.title), line(\"mut\", item.note)]);\n  return el(\"div\", { className: \"dg-hub\" }, [\n    el(\"div\", { className: \"hub-row\" }, data.nodes.slice(0, half).map(node)),\n    el(\"div\", { className: \"hub-center\" }, [line(\"cp-title\", data.center.title), line(\"hub-center-note\", data.center.note)]),\n    el(\"div\", { className: \"hub-row\" }, data.nodes.slice(half).map(node)),\n  ]);\n}\n\nexport const MORE = { matrix, flow, map, hub };\n","src/ui/brief_notes.js":"// 트렌드 브리프의 \"근거와 원문 비교\" 표(REQ-13): 번호, 출처·날짜·종류, 우리 문장, 짧은 원문 발췌와 확인 상태.\r\nimport { limitExcerpt, isWebUrl } from \"../domain/excerpt.js\";\r\nimport { el } from \"./layout.js\";\r\n\r\nexport const STATUS_TEXT = { verified: \"원문 문장 확인함\", read: \"페이지 열람함(요약본)\", summary: \"검색 요약만 봄\" };\r\n\r\nfunction excerptCell(note) {\r\n  const text = limitExcerpt(note.excerpt);\r\n  const parts = [];\r\n  if (text) parts.push(el(\"span\", { className: \"excerpt\", text: `“${text}”` }));\r\n  else parts.push(el(\"span\", { className: \"mut\", text: \"원문 발췌 없음\" }));\r\n  if (isWebUrl(note.url)) {\r\n    parts.push(el(\"a\", { className: \"link\", text: \"원문 열기 ↗\", attrs: { href: note.url, target: \"_blank\", rel: \"noopener noreferrer\" } }));\r\n  }\r\n  parts.push(el(\"span\", { className: `badge badge-${note.status}`, text: STATUS_TEXT[note.status] }));\r\n  return el(\"div\", { className: \"fn-cell\" }, parts);\r\n}\r\n\r\nfunction sourceCell(note) {\r\n  const meta = [note.date, note.kind, note.order].filter(Boolean).join(\" · \");\r\n  return el(\"div\", { className: \"fn-cell\" }, [el(\"b\", { text: note.title }), el(\"span\", { className: \"mut\", text: meta })]);\r\n}\r\n\r\n// 같은 줄의 칸들은 data-fn 번호로 묶는다(번호를 눌렀을 때 그 줄을 강조하려고)\r\nfunction tagged(node, number) {\r\n  node.setAttribute(\"data-fn\", String(number));\r\n  return node;\r\n}\r\n\r\nexport function footnoteTable(notes) {\r\n  const head = [\"번호\", \"출처 · 날짜 · 종류\", \"우리 문장\", \"원문 발췌 · 확인 상태\"].map((text) => el(\"div\", { className: \"fn-head\", text }));\r\n  const rows = notes.flatMap((note) => [\r\n    tagged(el(\"div\", { className: \"fn-cell fn-num\", text: String(note.number), attrs: { id: `fn-${note.number}` } }), note.number),\r\n    tagged(sourceCell(note), note.number),\r\n    tagged(el(\"div\", { className: \"fn-cell\", text: note.cites || \"—\" }), note.number),\r\n    tagged(excerptCell(note), note.number),\r\n  ]);\r\n  return el(\"div\", { className: \"fn-box\" }, [\r\n    el(\"div\", { className: \"fn-title\", text: \"근거와 원문 비교\" }),\r\n    el(\"div\", { className: \"fn-table\" }, [...head, ...rows]),\r\n  ]);\r\n}\r\n","src/domain/excerpt.js":"// 원문 발췌는 짧게만 보여 준다(저작권): 14단어 이하로 자르고, 바깥 따옴표는 뗀다. 링크로 원문을 열어 비교한다.\n\nexport const EXCERPT_MAX_WORDS = 14;\n\nexport function limitExcerpt(raw, max = EXCERPT_MAX_WORDS) {\n  const text = String(raw || \"\").trim().replace(/^[\"“”']+|[\"“”']+$/g, \"\").trim();\n  if (!text) return \"\";\n  const words = text.split(/\\s+/);\n  return words.length > max ? `${words.slice(0, max).join(\" \")}…` : text;\n}\n\nexport function isWebUrl(value) {\n  return /^https?:\\/\\/\\S+$/i.test(String(value || \"\"));\n}\n","demo_main.js":"import { showResearch } from \"./src/ui/research.js\";\nconst esc = s => s.replace(/&/g, \"&amp;\").replace(/</g, \"&lt;\").replace(/>/g, \"&gt;\");\nfunction inline(s) {\n  return esc(s).replace(/&lt;sup class=\"fn\"&gt;(\\d+)&lt;\\/sup&gt;/g, '<sup class=\"fn\">$1</sup>').replace(/\\*\\*(.+?)\\*\\*/g, \"<strong>$1</strong>\").replace(/`([^`]+)`/g, \"<code>$1</code>\")\n    .replace(/\\[([^\\]]+)\\]\\((https?:[^)]+)\\)/g, '<a href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1</a>');\n}\nconst markdown = { toHtml(t) {\n  const out = []; let list = null;\n  for (const raw of String(t || \"\").split(\"\\n\")) {\n    const l = raw.trimEnd();\n    const li = l.match(/^\\s*[-*]\\s+(.*)/) || l.match(/^\\s*\\d+\\.\\s+(.*)/);\n    if (li) { if (!list) list = []; list.push(\"<li>\" + inline(li[1]) + \"</li>\"); continue; }\n    if (list) { out.push(\"<ul>\" + list.join(\"\") + \"</ul>\"); list = null; }\n    if (!l.trim()) continue;\n    out.push(\"<p>\" + inline(l.replace(/^#+\\s*/, \"\")) + \"</p>\");\n  }\n  if (list) out.push(\"<ul>\" + list.join(\"\") + \"</ul>\");\n  return out.join(\"\");\n} };\nconst DOCS = window.DEMO_DOCS;\nconst services = { markdown, docs: { loadDetail: async () => ({ ok: true,\n  research: { market: \"us\", category: \"other\", clientId: \"demo\", question: \"미국 선케어에 진출할 수 있는지, 어떤 방식으로 진출할지.\" },\n  groups: [{ kind: \"trend_brief\", label: \"트렌드 브리프\", versions: [...DOCS].sort((a, b) => b.version - a.version) }] }) } };\nconst root = document.getElementById(\"app\");\nshowResearch(root, { services, onLogout: () => {}, go: () => {} }, \"202610-us-other-01\").then(() => {\n  const b = document.createElement(\"div\"); b.className = \"demo-banner\";\n  b.textContent = \"샘플 데이터로 띄운 읽기 전용 데모예요. 의뢰 기업을 설명하는 일부 내용은 ███로 가렸고, 실제 사이트는 로그인이 필요해서 주소를 공개하지 않아요.\";\n  root.prepend(b);\n});\n"};</script>
<script>
(function(){var S=window.DEMO_SRC,U={};function join(from,s){var p=from.split("/");p.pop();s.split("/").forEach(function(x){if(x==="..")p.pop();else if(x!==".")p.push(x);});return p.join("/");}
function load(p){if(U[p])return U[p];var code=S[p].replace(/from[ ]+"([.][^"]+)"/g,function(m,s){return 'from "'+load(join(p,s))+'"';});return U[p]=URL.createObjectURL(new Blob([code],{type:"text/javascript"}));}
import(load("demo_main.js")).catch(function(e){document.getElementById("app").textContent="데모를 불러오지 못했어요: "+e.message;});})();
</script></body></html>
