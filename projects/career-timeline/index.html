}
@media (prefers-color-scheme: dark) {

body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.65; padding-inline: 16px; padding-block: 28px 64px; }

.body { padding: 0 0 16px 19px; max-width: 64ch; }

@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }

var root = document.getElementById("root");
var chips = document.getElementById("chips");
var active = "all";

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render() {
  root.textContent = "";
  ERAS.forEach(function (era) {
    var items = era.items.filter(function (it) { return active === "all" || it.tag === active; });
    if (!items.length) return;
    var sec = el("section", "era");
    var h = el("h2");
    h.appendChild(el("span", null, era.title));
    h.appendChild(document.createTextNode(era.range));
    sec.appendChild(h);
    items.forEach(function (it) {
      var row = el("div", "item");
      var when = el("div", "when");
      it.when.split("\n").forEach(function (line, i) {
        if (i) when.appendChild(document.createElement("br"));
        when.appendChild(document.createTextNode(line));
      });
      row.appendChild(when);
      var d = document.createElement("details");
      if (it.t === "코스맥스 연구경영" && active === "all") d.open = true;
      d.style.setProperty("--c", TAGS[it.tag].c);
      var sm = document.createElement("summary");
      sm.appendChild(el("span", "dot"));
      var head = el("span", "head");
      head.appendChild(el("span", "title", it.t));
      if (it.s) head.appendChild(el("span", "sub", it.s));
      sm.appendChild(head);
      sm.appendChild(el("span", "tag", TAGS[it.tag].name));
      sm.appendChild(el("span", "caret"));
      d.appendChild(sm);
      var body = el("div", "body");
      if (it.pts && it.pts.length) {
        var ul = document.createElement("ul");
        it.pts.forEach(function (p) { ul.appendChild(el("li", null, p)); });
        body.appendChild(ul);
      } else {
        body.appendChild(el("p", null, it.s || "세부 내용 없음"));
      }
      if (it.note) body.appendChild(el("p", "note", it.note));
      d.appendChild(body);
      row.appendChild(d);
      sec.appendChild(row);
    });
    root.appendChild(sec);
  });
}

function drawChips() {
  chips.textContent = "";
  ["all"].concat(Object.keys(TAGS)).forEach(function (k) {
    var b = el("button", "chip", k === "all" ? "전체" : TAGS[k].name);
    b.type = "button";
    b.setAttribute("aria-pressed", String(active === k));
    b.addEventListener("click", function () { active = k; drawChips(); render(); });
    chips.appendChild(b);
  });
}

document.getElementById("openAll").addEventListener("click", function () {
  root.querySelectorAll("details").forEach(function (d) { d.open = true; });
});
document.getElementById("closeAll").addEventListener("click", function () {
  root.querySelectorAll("details").forEach(function (d) { d.open = false; });
});

drawChips();
render();
</script>

</body></html>
